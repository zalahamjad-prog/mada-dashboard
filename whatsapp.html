<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/mada-logo.png">
<title>Mada Care | Conversations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0b6b5c;
    --primary-dark: #08584b;
    --primary-soft: #e6f3ef;
    --ink: #10232b;
    --muted: #6b7a80;
    --border: #e3e8ea;
    --page: #f5f7f8;
    --card: #ffffff;
    --red: #dc2626; --red-soft: #fdecec;
    --orange: #d97706; --orange-soft: #fef3e2;
    --blue: #3b82f6; --blue-soft: #e8f0fe;
    --purple: #7c3aed; --purple-soft: #f1eafe;
    --green: #15803d; --green-soft: #e7f6ec;
    --font: "Inter", "Tajawal", system-ui, sans-serif;
  }
  [dir="rtl"] { --font: "Tajawal", "Inter", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--page); color: var(--ink); min-height: 100vh; }
  button, input, select { font: inherit; color: inherit; }
  svg { flex-shrink: 0; }
  [hidden] { display: none !important; }

  /* ---------- Top bar ---------- */
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 20px; height: 68px; padding: 0 28px; background: #fff; border-bottom: 1px solid var(--border); }
  .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
  .logo img { width: auto; height: 40px; }
  .logo-name { font-size: 17px; font-weight: 600; line-height: 1.1; }
  .logo-tag { font-size: 10.5px; color: var(--primary); }
  .nav { display: flex; gap: 4px; margin-inline-start: 18px; }
  .nav a { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: #44545a; text-decoration: none; }
  .nav a:hover { background: #f1f4f5; }
  .nav a[aria-current="page"] { background: var(--primary-soft); color: var(--primary); }
  .nav-count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 10.5px; font-weight: 600; line-height: 18px; text-align: center; }
  .top-actions { margin-inline-start: auto; display: flex; align-items: center; gap: 10px; }
  .lang-btn { display: flex; align-items: center; gap: 6px; background: none; border: 0; cursor: pointer; font-size: 13px; color: #44545a; padding: 8px; border-radius: 8px; }
  .lang-btn:hover { background: #f1f4f5; }
  .user { position: relative; }
  .user-btn { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 4px 6px; border-radius: 10px; text-align: start; }
  .user-btn:hover { background: #f1f4f5; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
  .user-name { display: block; font-size: 13px; font-weight: 600; }
  .user-role { display: block; font-size: 11px; color: var(--muted); }
  .user-menu { position: absolute; top: 110%; inset-inline-end: 0; min-width: 170px; background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(16,35,43,.08); padding: 6px; display: none; }
  .user.open .user-menu { display: block; }
  .user-menu a { display: block; padding: 9px 10px; border-radius: 6px; font-size: 13px; color: var(--ink); text-decoration: none; }
  .user-menu a:hover { background: var(--primary-soft); color: var(--primary); }

  main { max-width: 1320px; margin: 0 auto; padding: 24px 28px 40px; display: grid; gap: 18px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .page-head h1 { font-size: 24px; font-weight: 600; }
  .page-head p { margin-top: 4px; font-size: 13.5px; color: var(--muted); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; font-size: 13.5px; font-weight: 500; text-decoration: none; white-space: nowrap; }
  .btn svg { width: 17px; height: 17px; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-ghost { background: #fff; color: var(--ink); border-color: #d9e1e3; }
  .btn-ghost:hover { background: #f5f8f8; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: calc(100% - 32px); }
  @media (max-width: 1180px) { .user-meta { display: none; } }
  @media (max-width: 760px) {
    .topbar { padding: 10px 16px; gap: 8px; height: auto; flex-wrap: wrap; }
    .nav { order: 3; flex-basis: 100%; margin-inline-start: 0; }
    .lang-label { display: none; }
    main { padding: 16px 16px 32px; gap: 14px; }
    .page-head h1 { font-size: 21px; }
  }
  .nav { min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { flex: none; }
  .nav a.nav-soon { cursor: default; color: #9aa7ab; }
  .nav a.nav-soon:hover { background: none; }
  .soon-tag { height: 18px; padding: 0 7px; border-radius: 9px; background: var(--orange-soft); color: var(--orange); font-size: 10.5px; font-weight: 600; line-height: 18px; }
  /* ---------- Patients ---------- */
  .ph-title { display: flex; align-items: center; gap: 14px; }
  .ph-icon { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); }
  .ph-icon svg { width: 25px; height: 25px; }
  @media (max-width: 760px) { .ph-icon { width: 40px; height: 40px; } }
  /* ---------- Conversations (WhatsApp) ---------- */
  .wa { display: grid; grid-template-columns: 340px minmax(0, 1fr) 280px; height: calc(100vh - 190px); min-height: 520px; overflow: hidden; }
  .wa-list { display: flex; flex-direction: column; border-inline-end: 1px solid var(--border); min-height: 0; }
  .wa-tools { padding: 12px; display: grid; gap: 10px; border-bottom: 1px solid var(--border); }
  .wa-tools .srch { width: 100%; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button { height: 30px; padding: 0 11px; border-radius: 15px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 12.5px; font-weight: 600; color: #44545a; }
  .tabs button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .tabs button em { font-style: normal; opacity: .65; margin-inline-start: 4px; }
  .srch { position: relative; }
  .srch svg { position: absolute; top: 50%; inset-inline-start: 12px; transform: translateY(-50%); width: 17px; height: 17px; color: var(--muted); }
  .srch input { width: 100%; height: 38px; padding-inline: 38px 12px; border: 1px solid #d9e1e3; border-radius: 10px; background: #fff; font-size: 14px; outline: 0; }
  .srch input:focus { border-color: var(--primary); }
  .chats { overflow-y: auto; flex: 1; }
  .ch { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 11px 12px; border: 0; border-bottom: 1px solid #f0f3f4; background: #fff; cursor: pointer; text-align: start; }
  .ch:hover { background: #f7f9fa; }
  .ch[aria-current="true"] { background: var(--primary-soft); }
  .ch-av { width: 40px; height: 40px; border-radius: 50%; background: #e7f6ec; color: var(--green); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .ch-n { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch-l { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .ch-a { display: block; font-size: 11px; color: var(--primary); margin-top: 3px; }
  .ch-a.none { color: var(--orange); }
  .ch-r { display: grid; justify-items: end; gap: 4px; font-size: 11px; color: var(--muted); }
  .ch-u { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--green); color: #fff; font-size: 11px; font-weight: 700; line-height: 20px; text-align: center; }
  .wa-empty { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13.5px; line-height: 1.7; }
  .conv { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: #f4f1ec; }
  .cv-h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #fff; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .cv-h .back { display: none; }
  .cv-who { min-width: 0; flex: 1; }
  .cv-who b { display: block; font-size: 14.5px; }
  .cv-who span { font-size: 12px; color: var(--muted); }
  .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; white-space: nowrap; }
  .cv-act { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-sm { height: 34px; padding: 0 12px; font-size: 12.5px; }
  .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .bb { max-width: min(75%, 520px); padding: 8px 11px 6px; border-radius: 10px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 1px 1px rgba(0,0,0,.06); }
  .bb.in { align-self: flex-start; background: #fff; }
  .bb.out { align-self: flex-end; background: #d9fdd3; }
  .bb.failed { background: var(--red-soft); }
  .bb .meta { display: flex; gap: 6px; justify-content: flex-end; align-items: center; margin-top: 3px; font-size: 10.5px; color: var(--muted); }
  .bb .by { font-size: 11px; font-weight: 600; color: var(--primary); display: block; margin-bottom: 2px; }
  .bb .kind { display: inline-block; font-size: 12px; color: var(--muted); font-style: italic; }
  .bb .err { display: block; font-size: 11.5px; color: var(--red); margin-top: 3px; }
  .tick { font-weight: 700; } .tick.read { color: #3b82f6; }
  .note { align-self: center; max-width: 90%; padding: 5px 12px; border-radius: 8px; background: #fff8e6; color: #7a5b12; font-size: 12px; text-align: center; }
  .day { align-self: center; padding: 3px 10px; border-radius: 8px; background: #fff; color: var(--muted); font-size: 11.5px; margin: 6px 0; }
  .cmp { display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px; background: #fff; border-top: 1px solid var(--border); }
  .cmp textarea { flex: 1; min-height: 42px; max-height: 140px; resize: none; padding: 10px 12px; border: 1px solid #d9e1e3; border-radius: 10px; font: inherit; font-size: 14px; outline: 0; }
  .cmp textarea:focus { border-color: var(--primary); }
  .cmp-off { padding: 12px 14px; background: var(--orange-soft); color: #8a4b05; font-size: 12.5px; line-height: 1.6; border-top: 1px solid var(--border); }
  .side { border-inline-start: 1px solid var(--border); padding: 16px; overflow-y: auto; display: grid; align-content: start; gap: 14px; }
  .side h3 { font-size: 13px; color: var(--muted); font-weight: 600; }
  .pf { display: block; padding: 12px; border: 1px solid var(--border); border-radius: 10px; text-decoration: none; color: var(--ink); }
  .pf:hover { border-color: var(--primary); }
  .pf b { display: block; font-size: 14px; } .pf span { font-size: 12px; color: var(--muted); }
  .side p { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  .notice { padding: 14px 16px; border-radius: 12px; background: var(--orange-soft); color: #8a4b05; font-size: 13px; line-height: 1.7; }
  .ov { position: fixed; inset: 0; z-index: 1000; background: rgba(16,35,43,.45); display: grid; place-items: center; padding: 16px; }
  .md { width: min(420px, 100%); background: #fff; border-radius: 16px; box-shadow: 0 20px 50px rgba(16,35,43,.25); padding: 20px; display: grid; gap: 14px; }
  .md h2 { font-size: 17px; }
  .md select { height: 42px; border: 1px solid #d9e1e3; border-radius: 10px; padding: 0 10px; font-size: 14px; background: #fff; }
  .md label { display: grid; gap: 6px; font-size: 13px; }
  .md input, .md textarea { border: 1px solid #d9e1e3; border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 14px; outline: 0; }
  .md input:focus, .md textarea:focus, .md select:focus { border-color: var(--primary); }
  .md p { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  .tag-t { display: inline-block; height: 18px; padding: 0 7px; border-radius: 9px; background: var(--purple-soft); color: var(--purple); font-size: 10.5px; font-weight: 600; line-height: 18px; margin-inline-start: 6px; vertical-align: 1px; }
  .md-act { display: flex; gap: 8px; justify-content: flex-end; }
  @media (max-width: 1180px) { .wa { grid-template-columns: 300px minmax(0, 1fr); } .side { display: none; } }
  @media (max-width: 760px) {
    .wa { grid-template-columns: 1fr; height: calc(100vh - 170px); }
    .wa.open .wa-list { display: none; } .wa:not(.open) .conv { display: none; }
    .cv-h .back { display: inline-flex; }
    .bb { max-width: 88%; }
  }
</style>
</head>

      title: "المحادثات", subtitle: "رسائل العملاء على واتساب مدى كير. ردّي من هنا، ولكل محادثة موظفة مسؤولة عنها.",
      search: "ابحثي بالاسم أو الرقم", f_mine: "محادثاتي", f_none: "غير مسندة", f_all: "كل المفتوحة", f_closed: "المغلقة",
      noChats: "ما فيه محادثات هنا.", pick: "اختاري محادثة.", unassigned: "غير مسندة", owner: "عند {n}",
      assign: "إسناد", transfer: "تحويل", takeIt: "استلميها", close: "إغلاق", reopen: "إعادة فتح", back: "رجوع",
      assignT: "تحويل المحادثة", assignTo: "حوّليها إلى", nobody: "بدون (غير مسندة)", save: "تحويل", cancel: "إلغاء",
      typeMsg: "اكتبي ردك…", send: "إرسال", sending: "جاري الإرسال…",
      winClosed: "مرّ أكثر من ٢٤ ساعة على آخر رسالة من العميل. واتساب ما يسمح الحين إلا برسالة قالب معتمدة (قريباً)، أو انتظري العميل يكتب.",
      n_assign: "حوّلت {by} المحادثة إلى {to}", n_unassign: "ألغت {by} الإسناد", n_closed: "أغلقت {by} المحادثة", n_open: "أعادت {by} فتح المحادثة",
      patient: "ملف المريض", noPatient: "ما فيه ملف بهذا الجوال.", newFile: "ابحثي في المرضى", window: "الرد المجاني متاح حتى {t}", windowOff: "انتهت مهلة الرد",
      k_image: "صورة", k_audio: "رسالة صوتية", k_video: "فيديو", k_document: "ملف", k_sticker: "ملصق", k_location: "موقع", k_other: "نوع الرسالة: {t}", openPhone: "افتحيها من جوال الواتساب",
      failed: "ما انرسلت", today: "اليوم", yesterday: "أمس",
      offCloud: "المحادثات تحتاج قاعدة البيانات المشتركة وتسجيل دخول الموظفين (Supabase).", offSetup: "الواتساب لسا ما انربط. شغّل notes/supabase-whatsapp.sql في Supabase، وبعدها انشر دالة mada-whatsapp.",
      notConfigured: "مفاتيح الواتساب لسا ما انحطت في Supabase.", sendFail: "ما انرسلت: {e}", assigned: "تحولت إلى {n}", unassignedT: "انلغى الإسناد", offline: "ما فيه اتصال. حاولي مرة ثانية.",
      testNew: "رسالة تجربة", testTag: "تجربة", testT: "رسالة تجربة (كأنك العميل)", testHelp: "قبل ربط الواتساب: اكتبي كأنك العميل. الرسالة تطلع هنا مثل رسالة الواتساب، والرد عليها يبقى داخل النظام.",
      testNum: "جوال العميل", testName: "اسم العميل", testBody: "الرسالة", testSend: "أرسليها كأنك العميل", asCustomer: "اكتبي كأنك العميل", testDel: "حذف التجربة", testDelQ: "تحذفين محادثة التجربة هذي؟", testDeleted: "انحذفت محادثة التجربة", testRealNo: "هذا الرقم عليه محادثة واتساب حقيقية."
    }
  };
  let current = "en";
  const t = () => i18n[current];
  const tx = (k, v) => t()[k].replace(/\{(\w+)\}/g, (_, x) => v[x] == null ? "" : v[x]);
  const T = v => v && typeof v === "object" ? v[current] || v.en || v.ar || "" : v || "";
  const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const loc = () => current === "ar" ? "ar-SA-u-nu-latn-ca-gregory" : "en-GB";
  const hm = d => new Date(d).toLocaleTimeString(loc(), { hour: "numeric", minute: "2-digit" });
  const dayKey = d => new Date(d).toDateString();
  function dayLabel(d) {
    const k = dayKey(d), now = new Date();
    if (k === now.toDateString()) return t().today;
    if (k === new Date(now - 864e5).toDateString()) return t().yesterday;
    return new Date(d).toLocaleDateString(loc(), { day: "numeric", month: "short", year: "numeric" });
  }
  const shortWhen = d => !d ? "" : dayKey(d) === new Date().toDateString() ? hm(d) : dayLabel(d);
  // 966551234567 -> 0551234567 (the patient files keep the local form).
  const local = w => /^9665\d{8}$/.test(w) ? "0" + w.slice(3) : w;
  const shown = w => /^966\d{9}$/.test(w) ? "+966 " + w.slice(3, 5) + " " + w.slice(5, 8) + " " + w.slice(8) : "+" + w;
  const OFFICE = ["gm", "admin", "ops", "supervisor", "agent", "quality"];
  const staff = () => MadaStore.getJSON("mada-staff", []).filter(s => s.status !== "disabled" && OFFICE.includes(s.role));
  const myId = me && me.staffId ? String(me.staffId).toUpperCase() : null;

  let chats = [], msgs = [], sel = null, filter = null, q = "", ready = false, busy = false;
  const cloud = MadaStore.auth && MadaStore.auth.on;

  function notice(text) { $("notice").hidden = !text; $("notice").textContent = text || ""; }
  async function loadChats() {
    $("testBtn").hidden = !cloud;
    if (!cloud) { notice(t().offCloud); return; }
    const r = await MadaStore.auth.rpc("wa_list", {});
    if (r.ok && Array.isArray(r.json)) { chats = r.json; notice(""); }
    else if (r.status === 404 || (r.json && /wa_list/.test(JSON.stringify(r.json)))) notice(t().offSetup);
    if (!ready) { ready = true; if (filter == null) filter = chats.some(c => c.assigned_to === myId && c.status === "open") ? "mine" : "all"; }
    drawList();
    if (sel && !busy) loadThread(false);
  }
  async function loadThread(scroll) {
    const id = sel;
    const r = await MadaStore.auth.rpc("wa_thread", { p_wa_id: id });
    if (id !== sel || !r.ok || !Array.isArray(r.json)) return;
    const changed = r.json.length !== msgs.length || JSON.stringify(r.json.slice(-3)) !== JSON.stringify(msgs.slice(-3));
    msgs = r.json;
    const c = chats.find(x => x.wa_id === id); if (c) c.unread = 0;
    if (changed || scroll) drawConv(true); else drawHead();
  }

  const inFilter = (c, f) => f === "mine" ? c.status === "open" && c.assigned_to === myId : f === "none" ? c.status === "open" && !c.assigned_to : f === "closed" ? c.status === "closed" : c.status === "open";
  function drawList() {
    const F = ["mine", "none", "all", "closed"];
    $("tabs").innerHTML = F.map(f => `<button type="button" data-f="${f}" aria-pressed="${filter === f}">${esc(t()["f_" + f])}<em>${chats.filter(c => inFilter(c, f)).length}</em></button>`).join("");
    const s = q.trim().toLowerCase();
    const list = chats.filter(c => inFilter(c, filter)).filter(c => !s || [c.name, c.wa_id, local(c.wa_id), ...patientsOf(c).map(p => T(p.name))].some(v => String(v || "").toLowerCase().includes(s)));
    $("chats").innerHTML = list.length ? list.map(c => {
      const p = patientsOf(c)[0], name = c.name || (p && T(p.name)) || shown(c.wa_id);
      const last = c.last_body || "";
      return `<button type="button" class="ch" data-id="${esc(c.wa_id)}" aria-current="${c.wa_id === sel}">
        <span class="ch-av">${esc(String(name).trim().charAt(0) || "#")}</span>
        <span style="min-width:0"><span class="ch-n">${esc(name)}${c.test ? `<span class="tag-t">${esc(t().testTag)}</span>` : ""}</span><span class="ch-l">${c.last_dir === "out" ? "↩ " : ""}${esc(last)}</span>
          <span class="ch-a${c.assigned_to ? "" : " none"}">${esc(c.assigned_to ? tx("owner", { n: c.assigned_name || c.assigned_to }) : t().unassigned)}</span></span>
        <span class="ch-r"><span>${esc(shortWhen(c.last_at))}</span>${c.unread ? `<span class="ch-u">${c.unread}</span>` : ""}</span></button>`;
    }).join("") : `<div class="wa-empty">${esc(t().noChats)}</div>`;
  }
  const patientsOf = c => typeof MadaPatients !== "undefined" ? MadaPatients.findByMobile(local(c.wa_id)) : [];
  const winEnd = c => c && c.last_in_at ? new Date(c.last_in_at).getTime() + 864e5 : 0;

  function drawHead() {
    const c = chats.find(x => x.wa_id === sel), h = $("cvh"); if (!c || !h) return;
    const p = patientsOf(c)[0], name = c.name || (p && T(p.name)) || shown(c.wa_id), mine = c.assigned_to === myId;
    h.innerHTML = `<button type="button" class="btn btn-ghost btn-sm back" data-act="back">${esc(t().back)}</button>
      <div class="cv-who"><b>${esc(name)}${c.test ? `<span class="tag-t">${esc(t().testTag)}</span>` : ""}</b><span class="ltr">${esc(shown(c.wa_id))}</span> · <span>${esc(c.assigned_to ? tx("owner", { n: c.assigned_name || c.assigned_to }) : t().unassigned)}</span></div>
      <div class="cv-act">${!mine && myId && c.status === "open" ? `<button type="button" class="btn btn-primary btn-sm" data-act="take">${esc(t().takeIt)}</button>` : ""}
        <button type="button" class="btn btn-ghost btn-sm" data-act="assign">${esc(c.assigned_to ? t().transfer : t().assign)}</button>
        <button type="button" class="btn btn-ghost btn-sm" data-act="${c.status === "closed" ? "open" : "closed"}">${esc(c.status === "closed" ? t().reopen : t().close)}</button>
        ${c.test ? `<button type="button" class="btn btn-ghost btn-sm" data-act="asCustomer">${esc(t().asCustomer)}</button><button type="button" class="btn btn-ghost btn-sm" data-act="testDel">${esc(t().testDel)}</button>` : ""}</div>`;
    drawSide();
  }
  function bubble(m) {
    if (m.dir === "note") {
      const by = m.by_name || m.by_id || "";
      const text = m.type === "assign" ? (m.body ? tx("n_assign", { by, to: m.body }) : tx("n_unassign", { by })) : tx(m.type === "closed" ? "n_closed" : "n_open", { by });
      return `<div class="note">${esc(text)} · ${esc(hm(m.created_at))}</div>`;
    }
    const kind = m.type === "text" ? "" : `<span class="kind">${esc(t()["k_" + m.type] || tx("k_other", { t: m.type }))}${m.media_id ? " · " + esc(t().openPhone) : ""}</span>${m.body ? "\n" : ""}`;
    const tick = m.dir !== "out" ? "" : m.status === "read" ? '<span class="tick read">✓✓</span>' : m.status === "delivered" ? '<span class="tick">✓✓</span>' : m.status === "sent" ? '<span class="tick">✓</span>' : m.status === "failed" ? "" : "…";
    return `<div class="bb ${m.dir}${m.status === "failed" ? " failed" : ""}">${m.dir === "out" && m.by_name ? `<span class="by">${esc(m.by_name)}</span>` : ""}${kind}${esc(m.body || "")}<span class="meta">${esc(hm(m.created_at))} ${tick}</span>${m.status === "failed" ? `<span class="err">${esc(t().failed)}${m.error ? " · " + esc(m.error) : ""}</span>` : ""}</div>`;
  }
  function drawConv(scroll) {
    $("wa").classList.toggle("open", !!sel);
    const c = chats.find(x => x.wa_id === sel);
    if (!c) { $("conv").innerHTML = `<div class="wa-empty" style="margin:auto">${esc(t().pick)}</div>`; $("side").innerHTML = ""; return; }
    const box = $("msgs"), keep = box && box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    const draft = $("txt") ? $("txt").value : "";
    let last = "", html = "";
    msgs.forEach(m => { const k = dayKey(m.created_at); if (k !== last) { html += `<div class="day">${esc(dayLabel(m.created_at))}</div>`; last = k; } html += bubble(m); });
    const open = Date.now() < winEnd(c);
    $("conv").innerHTML = `<div class="cv-h" id="cvh"></div><div class="msgs" id="msgs">${html}</div>` + (open
      ? `<form class="cmp" id="cmp"><textarea id="txt" rows="1" placeholder="${esc(t().typeMsg)}"></textarea><button class="btn btn-primary" id="sendBtn" type="submit">${esc(t().send)}</button></form>`
      : `<div class="cmp-off">${esc(t().winClosed)}</div>`);
    if ($("txt")) $("txt").value = draft;
    drawHead();
    if (scroll || keep) $("msgs").scrollTop = $("msgs").scrollHeight;
  }
  function drawSide() {
    const c = chats.find(x => x.wa_id === sel); if (!c) return;
    const ps = patientsOf(c), end = winEnd(c);
    $("side").innerHTML = `<h3>${esc(t().patient)}</h3>` + (ps.length ? ps.map(p => `<a class="pf" href="patient.html?file=${encodeURIComponent(p.fileNo)}"><b>${esc(T(p.name))}</b><span class="ltr">${esc(p.fileNo)}</span></a>`).join("")
      : `<p>${esc(t().noPatient)}</p><a class="btn btn-ghost btn-sm" href="patients.html">${esc(t().newFile)}</a>`)
      + `<p>${esc(Date.now() < end ? tx("window", { t: dayLabel(end) + " " + hm(end) }) : t().windowOff)}</p>`;
  }

  async function send(e) {
    e.preventDefault();
    const ta = $("txt"), text = ta.value.trim(); if (!text || busy) return;
    busy = true; $("sendBtn").disabled = true; $("sendBtn").textContent = t().sending;
    const c = chats.find(x => x.wa_id === sel);
    // A test chat never goes to WhatsApp: the reply is only saved.
    const r = c && c.test ? await MadaStore.auth.rpc("wa_test_out", { p_wa_id: sel, p_body: text })
      : await MadaStore.auth.call("mada-whatsapp", { action: "send", waId: sel, text }, 30000);
    busy = false;
    if (r.ok) { ta.value = ""; }
    else toast(r.offline ? t().offline : r.json && r.json.error === "not_configured" ? t().notConfigured : tx("sendFail", { e: (r.json && (r.json.error || r.json.message)) || r.status }));
    if ($("sendBtn")) { $("sendBtn").disabled = false; $("sendBtn").textContent = t().send; }
    await loadChats(); await loadThread(true);
  }
  async function assign(staffId) {
    const r = await MadaStore.auth.rpc("wa_assign", { p_wa_id: sel, p_staff_id: staffId });
    if (!r.ok) { toast(r.offline ? t().offline : tx("sendFail", { e: (r.json && r.json.message) || r.status })); return; }
    toast(staffId ? tx("assigned", { n: r.json.assigned_name || staffId }) : t().unassignedT);
    await loadChats(); await loadThread(true);
  }
  function openAssign() {
    const c = chats.find(x => x.wa_id === sel); if (!c) return;
    $("md").innerHTML = `<h2>${esc(t().assignT)}</h2><label style="display:grid;gap:6px;font-size:13px">${esc(t().assignTo)}
      <select id="who"><option value="">${esc(t().nobody)}</option>${staff().map(s => `<option value="${esc(s.id)}"${s.id === c.assigned_to ? " selected" : ""}>${esc(T(s.name))} · ${esc(s.id)}</option>`).join("")}</select></label>
      <div class="md-act"><button type="button" class="btn btn-ghost" data-x>${esc(t().cancel)}</button><button class="btn btn-primary" type="submit">${esc(t().save)}</button></div>`;
    $("md").dataset.mode = "assign"; $("ov").hidden = false;
  }
  // Test mode: a message typed by staff as if it came from the customer (notes/supabase-whatsapp.sql, wa_test_in).
  function openTest(c) {
    const num = c ? local(c.wa_id) : "05" + String(Math.floor(Math.random() * 1e8)).padStart(8, "0");
    $("md").innerHTML = `<h2>${esc(t().testT)}</h2><p>${esc(t().testHelp)}</p>
      <label>${esc(t().testNum)}<input id="tNum" class="ltr" inputmode="tel" value="${esc(num)}"${c ? " readonly" : ""}></label>
      <label>${esc(t().testName)}<input id="tName" value="${esc(c ? c.name || "" : "")}"${c ? " readonly" : ""}></label>
      <label>${esc(t().testBody)}<textarea id="tBody" rows="3"></textarea></label>
      <div class="md-act"><button type="button" class="btn btn-ghost" data-x>${esc(t().cancel)}</button><button class="btn btn-primary" type="submit">${esc(t().testSend)}</button></div>`;
    $("md").dataset.mode = "test"; $("ov").hidden = false; $("tBody").focus();
  }
  async function sendTest() {
    const body = $("tBody").value.trim(); if (!body) { $("tBody").focus(); return; }
    const r = await MadaStore.auth.rpc("wa_test_in", { p_wa_id: $("tNum").value, p_name: $("tName").value, p_body: body });
    if (!r.ok) { toast(r.offline ? t().offline : r.json && /real WhatsApp/.test(r.json.message || "") ? t().testRealNo : tx("sendFail", { e: (r.json && r.json.message) || r.status })); return; }
    $("ov").hidden = true;
    sel = r.json.wa_id; msgs = [];
    await loadChats();
    const c = chats.find(x => x.wa_id === sel); if (c && !inFilter(c, filter)) filter = c.assigned_to === myId ? "mine" : c.assigned_to ? "all" : "none";
    drawList(); await loadThread(true);
  }
  $("testBtn").addEventListener("click", () => openTest(null));
  $("md").addEventListener("submit", e => { e.preventDefault(); if ($("md").dataset.mode === "test") { sendTest(); return; } const v = $("who").value || null; $("ov").hidden = true; assign(v); });
  $("ov").addEventListener("click", e => { if (e.target === $("ov") || e.target.closest("[data-x]")) $("ov").hidden = true; });

  $("chats").addEventListener("click", e => { const b = e.target.closest(".ch"); if (!b) return; sel = b.dataset.id; msgs = []; drawList(); drawConv(true); loadThread(true); });
  $("tabs").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (b) { filter = b.dataset.f; drawList(); } });
  $("q").addEventListener("input", e => { q = e.target.value; drawList(); });
  $("conv").addEventListener("submit", e => { if (e.target.id === "cmp") send(e); });
  $("conv").addEventListener("keydown", e => { if (e.target.id === "txt" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("cmp").requestSubmit(); } });
  $("conv").addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const a = b.dataset.act;
    if (a === "back") { sel = null; drawList(); drawConv(); }
    else if (a === "take") assign(myId);
    else if (a === "assign") openAssign();
    else if (a === "asCustomer") openTest(chats.find(x => x.wa_id === sel));
    else if (a === "testDel") { if (!confirm(t().testDelQ)) return; const r = await MadaStore.auth.rpc("wa_test_delete", { p_wa_id: sel }); if (!r.ok) { toast(t().offline); return; } toast(t().testDeleted); sel = null; msgs = []; await loadChats(); drawConv(); }
    else { const r = await MadaStore.auth.rpc("wa_set_status", { p_wa_id: sel, p_status: a }); if (!r.ok) toast(t().offline); await loadChats(); await loadThread(true); }
  });
  function toast(msg) { const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3500); }
  // New messages: checked every 5 seconds while the page is in front.
  setInterval(() => { if (!document.hidden) loadChats(); }, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) loadChats(); });

  function setLang(lang) {
    current = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t()[el.dataset.i18n]);
    $("q").placeholder = t().search;
    if (me) { $("userName").textContent = me.name[lang]; $("userRole").textContent = me.role[lang]; $("avatar").textContent = me.initials[lang]; }
    document.title = lang === "ar" ? "مدى كير | المحادثات" : "Mada Care | Conversations";
    try { localStorage.setItem("mada-lang", lang); } catch (e) {}
    drawList(); drawConv();
  }
  $("langToggle").addEventListener("click", () => setLang(current === "en" ? "ar" : "en"));
  const user = $("user"), userBtn = $("userBtn");
  userBtn.addEventListener("click", e => { e.stopPropagation(); userBtn.setAttribute("aria-expanded", user.classList.toggle("open")); });
  document.addEventListener("click", () => { user.classList.remove("open"); userBtn.setAttribute("aria-expanded", false); });
  $("logout").addEventListener("click", e => { e.preventDefault(); MadaAuth.logout(); });
  { const n = MadaOrders.needsAction(), c = $("navCount"); c.hidden = !n; c.textContent = n; }
  let saved = "en";
  try { saved = localStorage.getItem("mada-lang") || "en"; } catch (e) {}
  setLang(saved);
  loadChats();
</script>
</body>
</html>
