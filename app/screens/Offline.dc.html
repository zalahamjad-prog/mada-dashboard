<script type="text/x-dc" data-dc-script data-props='{"initial":{"editor":"enum","default":"offline","options":["offline","retrying","server","back"]},"$preview":{"width":390,"height":844}}'>
// offline: the phone has no internet (NetInfo). server: internet works but the Mada API does not answer.
// The app retries on its own every few seconds and as soon as NetInfo reports a connection; nothing typed is lost.
class Component extends DCLogic {
  st() { return { mode: this.props.initial || 'offline', ...(this.state || {}) }; }
  put(p) { this.setState({ ...this.st(), ...p }); }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const s = this.st();
    const server = s.mode === 'server';
    const retrying = s.mode === 'retrying';
    const back = s.mode === 'back';
    const T = server
      ? ['نواجه مشكلة مؤقتة', 'خدمات مدى كير غير متاحة لحظيًا. اتصالك سليم، ونعمل على إعادتها بأسرع وقت.']
      : ['لا يوجد اتصال بالإنترنت', 'تأكد من تشغيل بيانات الجوال أو الواي فاي. بياناتك محفوظة ولن تضيع.'];
    const ok = !retrying && !back;
    return {
      title: back ? 'رجع الاتصال 💚' : T[0],
      body: back ? 'جاري فتح التطبيق من حيث توقفت.' : T[1],
      retrying, back,
      statusText: back ? 'تم الاتصال' : retrying ? 'جاري المحاولة…' : 'نعيد المحاولة تلقائيًا أول ما يرجع الاتصال',
      statusStyle: `margin-top: 14px; align-self: center; display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; background: ${back ? '#E9F6F1' : '#F2FAF6'}; color: ${back ? '#22684F' : '#2B7F62'};`,
      btnLabel: retrying ? 'جاري المحاولة…' : 'إعادة المحاولة',
      btnStyle: `height: 56px; border-radius: 14px; border: 0; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: Tajawal, sans-serif; font-size: 17px; font-weight: 700; cursor: pointer; background: ${ok ? '#4CB491' : '#D3DEDA'}; color: ${ok ? '#014359' : '#6B7D78'};${back ? ' visibility: hidden;' : ''}`,
      retry: () => { this.put({ mode: 'retrying' }); clearTimeout(this.t); this.t = setTimeout(() => { this.put({ mode: server ? 'server' : 'offline' }); Mada.retry && Mada.retry(); }, 1600); },
      callSupport: () => Mada.call(),
    };
  }
}
</script>
