<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الوصفات الطبية · مدى كير</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&amp;family=Inter:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.mc-btn:focus-visible,.mc-tab:focus-visible,.mc-link:focus-visible,.mc-seg:focus-visible,.mc-row:focus-visible,.mc-star:focus-visible,.mc-chip:focus-visible{outline:3px solid #014359;outline-offset:2px}
.mc-hero{background-color:#2F8F6E;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 2px,transparent 2px 22px),repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 2px,transparent 2px 22px),linear-gradient(180deg,#4CB491 0%,#2F8F6E 60%,#23705A 100%)}
textarea::placeholder{color:#7F9196}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: {{pageH}}; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F8F8; color: #0E2A33; font-family: Tajawal, sans-serif; display: flex; flex-direction: column;">
  <div style="flex-shrink: 0; padding: 52px 16px 8px; display: flex; align-items: center; gap: 8px;">
    <button class="mc-link" aria-label="رجوع لملفي الصحي" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #E3EAEB; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#014359" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M9 18l6-6-6-6"></path></svg></button>
    <h1 style="margin: 0; font-size: 18px; line-height: 28px; color: #0E2A33; flex-grow: 1;">الوصفات الطبية</h1>
  </div>
  <main style="flex-shrink: 0; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 14px;">
    <sc-for list="{{list}}" as="x" hint-placeholder-count="2">
    <article style="background: #FFFFFF; border-radius: 20px; padding: 16px; box-shadow: 0 4px 16px rgba(1,67,89,0.06); display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 22px; background: #E6EFF2; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 17px; font-weight: 700; color: #014359;">{{x.ini}}</span>
        <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0;"><strong style="font-size: 15px; line-height: 22px;">{{x.doctor}}</strong><span style="font-size: 12px; line-height: 18px; color: #51656B;">وصفة طبية · {{x.date}}</span></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; background: #F6F8F8; border-radius: 12px; padding: 10px 12px;">
        <span style="display: flex; flex-direction: column;"><span style="font-size: 12px; color: #51656B;">رقم الطلب</span><strong dir="ltr" style="font-family: Inter, sans-serif; font-size: 14px; text-align: right;">{{x.orderNo}}</strong></span>
        <span style="display: flex; flex-direction: column;"><span style="font-size: 12px; color: #51656B;">رقم الحجز</span><strong dir="ltr" style="font-family: Inter, sans-serif; font-size: 14px; text-align: right;">{{x.bookingNo}}</strong></span>
      </div>
      <button class="mc-btn" onClick="{{x.pdf}}" style="height: 54px; border-radius: 14px; border: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: Tajawal, sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; height: 48px; font-size: 15px; background: #4CB491; color: #014359;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#014359" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M5 21h14"></path></svg><span>تحميل الوصفة PDF</span></button>
    </article>
    </sc-for>
    <p style="margin: 0 4px; font-size: 12px; line-height: 18px; color: #51656B; text-align: center;">الوصفة نفس اللي يصدرها الطبيب من سجل مدى كير الطبي، وتقدر تصرفها من أي صيدلية.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pageH":{"editor":"string","default":"844px"},"$preview":{"width":390,"height":844}}'>
// Prescriptions in the health file: one per doctor visit with medicines (MadaReport.hasRx), downloaded with MadaReport.downloadRx (the same PDF as the doctors portal).
class Component extends DCLogic {
  renderVals() {
    return {
      pageH: this.props.pageH || '844px',
      // Approved doctor visits with medicines (Mada.rx()); the PDF is the doctors portal's prescription (MadaReport.downloadRx).
      list: Mada.rx().map((x) => ({ ...x, ini: (x.doctor || 'د').replace(/^د\.\s*/, '').charAt(0), pdf: () => Mada.pdf && Mada.pdf('rx', x.id) })),
    };
  }
}
</script>
</body>
</html>
