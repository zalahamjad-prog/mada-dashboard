<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/mada-logo.png">
<title>Mada Care | Samples</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0b6b5c; --primary-soft: #e6f3ef; --teal: #12a37f; --navy: #0b3a55;
    --ink: #10232b; --muted: #6b7a80; --border: #e3e8ea; --page: #f6f8f9;
    --orange: #d97706; --orange-soft: #fef3e2;
    --font: "Inter", "Tajawal", system-ui, sans-serif;
  }
  [dir="rtl"] { --font: "Tajawal", "Inter", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--page); color: var(--ink); min-height: 100vh; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }

  /* Sidebar */
  .side { position: sticky; top: 0; height: 100vh; background: #fff; border-inline-end: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; gap: 22px; overflow: hidden; }
  .logo { display: flex; align-items: center; gap: 8px; padding: 0 6px; text-decoration: none; color: var(--ink); }
  .logo img { height: 40px; width: auto; }
  .logo b { display: block; font-size: 18px; font-weight: 600; line-height: 1.1; }
  .logo small { font-size: 10.5px; color: var(--primary); }
  .menu { display: grid; gap: 4px; }
  .menu a { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #2c3d43; font-size: 14px; font-weight: 500; }
  .menu a svg { width: 21px; height: 21px; flex: none; }
  .menu a:hover { background: #f3f6f7; }
  .menu a[aria-current="page"] { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .menu a.soon { color: #8a979c; cursor: default; }
  .menu a.soon:hover { background: none; }
  .soon-tag { margin-inline-start: auto; height: 18px; padding: 0 7px; border-radius: 9px; background: var(--orange-soft); color: var(--orange); font-size: 10.5px; font-weight: 600; line-height: 18px; }
  .support { order: 3; display: flex; align-items: center; gap: 12px; padding: 14px 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
  .support svg { width: 26px; height: 26px; color: #2c3d43; flex: none; }
  .support b { display: block; font-weight: 600; }
  .support a { color: var(--muted); text-decoration: none; }
  .side-art { order: 2; margin-top: auto; margin-inline-start: -14px; width: 170px; color: #e3f2ee; }
  [dir="rtl"] .side-art { transform: scaleX(-1); }

  /* Top bar */
  .top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: flex-end; gap: 14px; height: 76px; padding: 0 28px; background: rgba(246,248,249,.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
  .lang-btn { display: flex; align-items: center; gap: 6px; background: none; border: 0; cursor: pointer; font-size: 13px; color: #44545a; padding: 8px; border-radius: 8px; }
  .lang-btn:hover, .bell:hover { background: #eef2f3; }
  .lang-btn svg { width: 16px; height: 16px; }
  .bell { position: relative; width: 42px; height: 42px; border: 0; background: none; border-radius: 50%; cursor: pointer; display: grid; place-items: center; color: #2c3d43; }
  .bell svg { width: 23px; height: 23px; }
  .sep { width: 1px; height: 34px; background: var(--border); }
  .user { position: relative; }
  .user-btn { display: flex; align-items: center; gap: 12px; background: none; border: 0; cursor: pointer; padding: 4px 6px; border-radius: 12px; text-align: start; }
  .user-btn:hover { background: #eef2f3; }
  .ava { width: 50px; height: 50px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 700; font-size: 16px; overflow: hidden; flex: none; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--border); }
  .ava img { width: 100%; height: 100%; object-fit: cover; }
  .u-name { display: block; font-size: 14px; font-weight: 600; }
  .u-spec { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .user-btn > svg { width: 16px; height: 16px; color: #44545a; }
  .user-menu { position: absolute; top: 110%; inset-inline-end: 0; min-width: 180px; background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(16,35,43,.08); padding: 6px; display: none; }
  .user.open .user-menu { display: block; }
  .user-menu a { display: block; padding: 9px 10px; border-radius: 6px; font-size: 13px; color: var(--ink); text-decoration: none; }
  .user-menu a:hover { background: var(--primary-soft); color: var(--primary); }

  /* Content */
  main { padding: 22px 28px 32px; }
  .stage { position: relative; overflow: hidden; min-height: calc(100vh - 76px - 54px); border-radius: 18px; border: 1px solid var(--border); background: radial-gradient(circle at 0 0, #e9f5f1 0, rgba(233,245,241,0) 220px), linear-gradient(160deg, #ffffff 55%, #fff3e8 100%); display: grid; place-items: center; padding: 40px 20px; }
  .stage::after { content: ""; position: absolute; width: 360px; height: 360px; border-radius: 50%; inset-inline-end: -120px; bottom: -150px; background: rgba(253,214,180,.35); }
  .empty { position: relative; z-index: 1; display: grid; justify-items: center; text-align: center; max-width: 560px; }
  .empty-art { width: 330px; max-width: 100%; height: auto; margin-bottom: 18px; }
  .empty h1 { font-size: 30px; font-weight: 700; color: #15304a; letter-spacing: -.3px; }
  .empty p { margin-top: 10px; font-size: 16px; color: var(--muted); line-height: 1.6; }
  .rule { width: 60px; height: 4px; border-radius: 2px; background: var(--teal); margin: 26px 0; }
  .quote { display: flex; align-items: flex-start; gap: 12px; padding: 16px 22px; border-radius: 12px; background: rgba(230,243,239,.75); font-size: 17px; font-weight: 500; color: #15304a; line-height: 1.5; text-align: start; }
  .quote span.q { font-size: 34px; line-height: .9; color: var(--teal); font-weight: 700; font-family: Georgia, serif; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 13px; max-width: calc(100% - 32px); }
  .panel { background: #fff; border: 1px solid var(--border); border-radius: 18px; }
  .p-head { display: flex; align-items: center; gap: 18px; padding: 22px 26px; border-bottom: 1px solid #eef2f3; }
  .p-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--primary-soft); color: var(--teal); display: grid; place-items: center; flex: none; }
  .p-icon svg { width: 30px; height: 30px; }
  .p-head h1 { font-size: 28px; font-weight: 700; color: #15304a; }
  .p-head p { font-size: 15px; color: var(--muted); margin-top: 4px; }
  .tools { display: flex; gap: 14px; padding: 18px 22px 6px; }
  .search { flex: 1; display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 16px; border: 1px solid var(--border); border-radius: 10px; background: #fff; min-width: 0; }
  .search:focus-within, .dates:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(18,163,127,.12); outline: 0; }
  .search svg { width: 20px; height: 20px; color: #3d4f57; flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 14px; background: none; }
  .vtabs { display: flex; gap: 4px; margin: 0 0 18px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .vtabs::-webkit-scrollbar { display: none; }
  .vtabs button { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 18px; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; background: none; cursor: pointer; font: inherit; font-size: 15px; font-weight: 600; color: var(--muted); }
  .vtabs button:hover { color: #15304a; }
  .vtabs button[aria-selected="true"] { color: var(--teal); border-color: var(--teal); }
  .vtabs .cnt { min-width: 24px; height: 22px; padding: 0 7px; border-radius: 11px; background: #eef2f3; color: #44545a; font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; }
  .vtabs button[aria-selected="true"] .cnt { background: #e3f4ee; color: #0f6b52; }
  @media (max-width: 760px) { .vtabs { gap: 0; } .vtabs button { flex: 1 1 0; min-width: 0; flex-direction: column; justify-content: center; gap: 3px; height: 62px; padding: 0 4px; font-size: 12.5px; line-height: 1.2; white-space: normal; text-align: center; } .vtabs .cnt { height: 18px; min-width: 20px; font-size: 11px; } }
  /* Samples */
  .vtabs { margin: 0; padding: 0 22px; }
  .alert { display: flex; align-items: center; gap: 14px; margin: 18px 22px 0; padding: 14px 16px; border-radius: 12px; background: #fdecec; color: #8f1d14; border: 1px solid #f7c9c4; }
  .alert > svg { width: 26px; height: 26px; flex: none; }
  .alert b { display: block; font-size: 15px; }
  .alert span { font-size: 13px; line-height: 1.5; }
  .alert.info { background: #eef6fb; color: #164a6b; border-color: #cfe3f1; }
  .alert .btn { margin-inline-start: auto; flex: none; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 18px 22px 0; }
  .stat { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: #fff; cursor: pointer; text-align: start; font: inherit; }
  .stat:hover { border-color: #c9d4d8; }
  .stat[aria-pressed="true"] { border-color: currentColor; box-shadow: 0 0 0 1px currentColor inset; }
  .stat i { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .stat i svg { width: 21px; height: 21px; }
  .stat b { display: block; font-size: 24px; line-height: 1; color: #15304a; font-variant-numeric: tabular-nums; }
  .stat small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 4px; font-weight: 600; }
  .stat.k-due { color: #c2261b; } .stat.k-due i { background: #fdecec; }
  .stat.k-waiting { color: #b26a00; } .stat.k-waiting i { background: #fff4dc; }
  .stat.k-ready { color: #0f8f6f; } .stat.k-ready i { background: #dff5ec; }
  .stat.k-collect { color: #2563eb; } .stat.k-collect i { background: #e8f0fe; }
  .stat.k-sent { color: #5d6d78; } .stat.k-sent i { background: #eef2f4; }
  .list { display: grid; gap: 14px; padding: 16px 22px 24px; }
  .sc { border: 1px solid var(--border); border-radius: 16px; background: #fff; overflow: hidden; border-inline-start: 5px solid #cfd9dc; scroll-margin-top: 90px; }
  .sc.s-due { border-inline-start-color: #dc2626; }
  .sc.s-waiting { border-inline-start-color: #f59e0b; }
  .sc.s-ready { border-inline-start-color: #12a37f; }
  .sc.s-collect { border-inline-start-color: #3b82f6; }
  .sc.hl { box-shadow: 0 0 0 3px rgba(18,163,127,.25); }
  .sc-h { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px 10px; flex-wrap: wrap; }
  .sc-who { min-width: 0; flex: 1 1 220px; }
  .sc-who b { display: block; font-size: 16px; color: #15304a; }
  .sc-who small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12px; font-weight: 700; background: #eef2f4; color: #44545a; white-space: nowrap; }
  .chip svg { width: 14px; height: 14px; }
  .chip.doc { background: #f1eafe; color: #6d28d9; } .chip.pat { background: #e8f0fe; color: #1d4ed8; }
  .chip.due { background: #fdecec; color: #b42318; } .chip.waiting { background: #fff4dc; color: #a15c00; } .chip.ready { background: #dff5ec; color: #0f7a5f; }
  .chip.collect { background: #e8f0fe; color: #1d4ed8; } .chip.sent { background: #eef2f4; color: #44545a; }
  .chip.critical { background: #b42318; color: #fff; } .chip.out { background: #fff1e0; color: #a4520a; }
  .sc-m { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 0 18px 12px; font-size: 13px; color: #44545a; }
  .sc-m span { display: inline-flex; align-items: center; gap: 6px; }
  .sc-m svg { width: 15px; height: 15px; color: #6b7a80; }
  .tl { list-style: none; border-top: 1px solid #eef2f3; }
  .tl li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 11px 18px; border-bottom: 1px solid #f2f5f6; }
  .tl .nm { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
  .tl .nm b { font-size: 14px; color: #15304a; }
  .tl .code { font-size: 11px; font-weight: 700; color: #0b6b5c; background: #e3f4ee; padding: 2px 7px; border-radius: 6px; direction: ltr; }
  .tube { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .cd { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; white-space: nowrap; color: #a15c00; }
  .cd svg { width: 15px; height: 15px; }
  .cd small { font-weight: 500; color: var(--muted); font-size: 12px; }
  .cd.due { color: #c2261b; } .cd.ok { color: #0f8f6f; } .cd.na { color: var(--muted); font-weight: 600; }
  .bar { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: #eef2f4; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: #f59e0b; }
  .bar i.due { background: #dc2626; } .bar i.ok { background: #12a37f; }
  .sc-f { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 18px 14px; background: #fbfcfc; }
  .sc-f .to { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: #44545a; margin-inline-end: auto; }
  .sc-f .to svg { width: 16px; height: 16px; color: #6b7a80; }
  .none { padding: 50px 20px; text-align: center; color: var(--muted); }
  .none b { display: block; font-size: 17px; color: #15304a; margin-bottom: 6px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; font: inherit; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .btn svg { width: 18px; height: 18px; }
  .btn-light { background: #f6f8fa; border-color: #dfe5e8; color: #15304a; }
  .btn-light:hover { background: #eef2f4; }
  .btn-dark { background: var(--navy); color: #fff; }
  .btn-dark:hover { background: #082d42; }
  .btn-go { background: var(--teal); color: #fff; }
  .btn-go:hover { background: #0f8f6f; }
  .btn-red { background: #dc2626; color: #fff; }
  .btn-red:hover { background: #b91c1c; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* Popups */
  .ov { position: fixed; inset: 0; z-index: 50; background: rgba(16,35,43,.42); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
  .dlg { position: relative; width: 100%; max-width: 760px; background: #fff; border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.18); margin: auto; padding: 22px 24px 20px; }
  .dlg.sm { max-width: 420px; }
  .x { position: absolute; top: 16px; inset-inline-end: 16px; width: 34px; height: 34px; border: 0; background: none; border-radius: 8px; cursor: pointer; color: #44545a; display: grid; place-items: center; }
  .x:hover { background: #f1f4f5; }
  .x svg { width: 20px; height: 20px; }
  .dh { display: flex; gap: 14px; align-items: center; padding-inline-end: 34px; margin-bottom: 14px; }
  .dh .ic { width: 50px; height: 50px; border-radius: 50%; background: #e3f4ee; color: var(--teal); display: grid; place-items: center; flex: none; }
  .dh .ic svg { width: 25px; height: 25px; }
  .dh h3 { font-size: 21px; font-weight: 700; color: #15304a; }
  .dh p { font-size: 13.5px; color: #5d6d78; margin-top: 2px; }
  .rt { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .rt-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 14px; background: #f5f8f9; font-size: 14px; }
  .rt-h b { color: #15304a; }
  .rt-h .cd { margin-inline-start: auto; font-size: 12.5px; }
  .rt table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .rt th { text-align: start; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 14px 4px; }
  .rt td { padding: 8px 14px; border-top: 1px solid #f0f3f4; vertical-align: middle; }
  .rt td.n { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; color: #5d6d78; white-space: nowrap; }
  .rt input, .rt textarea { width: 120px; height: 40px; padding: 0 10px; border: 1px solid #cfd9dc; border-radius: 8px; font: inherit; font-size: 14px; direction: ltr; text-align: center; }
  .rt textarea { width: 100%; height: 76px; padding: 8px 10px; direction: auto; text-align: start; resize: vertical; }
  .rt input:focus, .rt textarea:focus { outline: 0; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(18,163,127,.12); }
  .rt .hint { padding: 10px 14px 0; font-size: 12.5px; color: var(--muted); }
  .rt .tx { padding: 8px 14px 12px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11.5px; font-weight: 700; background: #eef2f4; color: #6b7a80; white-space: nowrap; }
  .pill.normal { background: #e3f4ee; color: #0f6b52; } .pill.low, .pill.high { background: #fff1e0; color: #a4520a; } .pill.critical { background: #b42318; color: #fff; }
  .val { font-weight: 700; color: #15304a; }
  .rep { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; border: 1px dashed #c9d4d8; background: #fbfcfc; margin-bottom: 12px; }
  .rep > svg { width: 26px; height: 26px; color: #5d6d78; flex: none; }
  .rep > div { flex: 1 1 200px; min-width: 0; }
  .rep b { display: block; font-size: 14.5px; color: #15304a; }
  .rep small { display: block; font-size: 12.5px; color: #5d6d78; margin-top: 2px; line-height: 1.5; overflow-wrap: anywhere; }
  .rep.ok { border-style: solid; border-color: #cdebdf; background: #f4fbf8; }
  .rep.ok > svg { color: #0f8f6f; }
  .rep.bad { border-color: #dc2626; background: #fdf3f2; }
  .rep-a { display: flex; flex-wrap: wrap; gap: 8px; }
  .rep-a .btn { height: 40px; }
  .sc-m .rp { color: #0f8f6f; font-weight: 600; } .sc-m .rp svg { color: #0f8f6f; }
  .appr { margin-top: 6px; padding: 14px; border-radius: 12px; background: #f4fbf8; border: 1px solid #cdebdf; }
  .appr label { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: #15304a; cursor: pointer; line-height: 1.5; }
  .appr input { width: 20px; height: 20px; accent-color: var(--teal); flex: none; margin-top: 1px; }
  .appr p { font-size: 12.5px; color: #44545a; margin: 6px 0 0 30px; line-height: 1.5; }
  [dir="rtl"] .appr p { margin: 6px 30px 0 0; }
  .df { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .err { color: #b42318; font-size: 13px; margin-top: 10px; }
  .sent-box { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; background: #f4fbf8; color: #0b6b5c; font-size: 13.5px; margin-bottom: 12px; line-height: 1.5; }
  .sent-box svg { width: 20px; height: 20px; flex: none; }
  .fld { display: grid; gap: 6px; font-size: 13px; color: #44545a; font-weight: 600; }
  .fld input { height: 46px; padding: 0 12px; border: 1px solid #cfd9dc; border-radius: 10px; font: inherit; font-size: 15px; direction: ltr; }
  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; align-content: start; }
    .side { position: static; height: auto; flex-direction: row; align-items: center; gap: 12px; padding: 10px 12px; border-inline-end: 0; border-bottom: 1px solid var(--border); }
    .logo { flex: none; }
    .logo img { height: 34px; }
    .logo span { display: none; }
    .menu { display: flex; overflow-x: auto; scrollbar-width: none; min-width: 0; }
    .menu::-webkit-scrollbar { display: none; }
    .menu a { flex: none; height: 38px; padding: 0 12px; font-size: 13px; gap: 8px; }
    .menu a svg { width: 18px; height: 18px; }
    .side-art, .support { display: none; }
    .top { height: 66px; padding: 0 12px; gap: 8px; }
    .user-meta { display: none; }
    .ava { width: 42px; height: 42px; }
    main { padding: 14px 12px 24px; }
    .p-head { padding: 16px; gap: 12px; }
    .p-icon { width: 48px; height: 48px; }

      : `<button type="button" class="btn ${c.status === "due" ? "btn-red" : "btn-dark"}" data-res="${esc(c.key)}">${S(I.pen)}${anyIn ? t().edit : t().enter}</button>`;
    return `<article class="sc s-${c.status} ${openKey === c.key ? "hl" : ""}" id="c-${esc(c.key.replace(/[^\w-]/g, "_"))}">
      <div class="sc-h"><div class="sc-who"><b>${esc(T(o.patient))}</b><small><span dir="ltr">${esc(o.mrn || "")}</span>${o.bookingId ? ` · ${t().booking} <span dir="ltr">${esc(o.bookingId)}</span>` : ""}</small></div>
        <div class="chips">${src}<span class="chip ${c.status === "sent" ? "sent" : c.status}">${t()["st_" + stK]}</span>${fl === "critical" ? `<span class="chip critical">${S(I.warn, 2.2)}${t().critical}</span>` : fl === "high" || fl === "low" ? `<span class="chip out">${t().out}</span>` : ""}</div></div>
      <div class="sc-m">${c.collectedAt ? `<span>${S(I.drop)}${esc(tx("taken", { t: when(c.collectedAt) }))}</span>` : ""}<span>${S(I.flask)}${n === 1 ? t().nTests1 : esc(tx("nTests", { n }))}</span>${c.report ? `<span class="rp">${S(I.ok, 2.2)}${t().repHas}</span>` : ""}</div>
      <ul class="tl">${c.tests.map(x => testRow(c, x)).join("")}</ul>
      <div class="sc-f"><span class="to">${S(c.kind === "doctor" ? I.doc : I.team)}${esc(to)}</span>${act}</div>
    </article>`;
  }

  function render() {
    const all = cards(), q = $("q").value.trim(), cnt = k => all.filter(c => c.status === k).length;
    const dueTests = all.filter(c => c.status === "due").reduce((s, c) => s + c.tests.filter(x => x.due).length, 0), ready = cnt("ready");
    // Reminders at the top: results that are due, results not sent, and turning on device reminders.
    let al = "";
    if (dueTests) al += `<div class="alert">${S(I.bell, 2)}<div><b>${dueTests === 1 ? t().dueT1 : esc(tx("dueT", { n: dueTests }))}</b><span>${t().dueS}</span></div></div>`;
    if (ready) al += `<div class="alert info">${S(I.send, 2)}<div><b>${ready === 1 ? t().readyT1 : esc(tx("readyT", { n: ready }))}</b><span>${t().readyS}</span></div></div>`;
    if (typeof Notification !== "undefined" && Notification.permission === "default" && all.some(c => c.status !== "sent"))
      al += `<div class="alert info">${S(I.bell, 2)}<div><b>${t().ntfT}</b><span>${t().ntfS}</span></div><button type="button" class="btn btn-dark" id="ntfOn">${t().ntfOn}</button></div>`;
    $("alerts").innerHTML = al;
    const KS = ["due", "waiting", "ready", ...(cnt("collect") ? ["collect"] : [])];
    const ICK = { due: I.warn, waiting: I.clock, ready: I.send, collect: I.drop };
    $("stats").style.gridTemplateColumns = innerWidth > 900 ? `repeat(${KS.length}, minmax(0, 1fr))` : "";
    $("stats").innerHTML = KS.map(k => `<button type="button" class="stat k-${k}" data-k="${k}" aria-pressed="${kind === k}"><i>${S(ICK[k], 2)}</i><span><b>${cnt(k)}</b><small>${t()["k_" + k]}</small></span></button>`).join("");
    const todoN = all.filter(c => c.status !== "sent").length, sentN = cnt("sent");
    $("vtabs").innerHTML = [["todo", t().tabTodo, todoN], ["sent", t().tabSent, sentN]].map(([k, l, n]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}<span class="cnt">${n}</span></button>`).join("");
    const list = sorted(all.filter(c => (tab === "sent" ? c.status === "sent" : c.status !== "sent") && (!kind || tab === "sent" || c.status === kind) && match(c, q)));
    $("list").innerHTML = list.length ? list.map(cardHtml).join("")
      : `<div class="none"><b>${t().none}</b>${q ? t().noneQ : tab === "sent" ? t().noneSent : t().noneTodo}</div>`;
  }

  // Enter results: each test with its result fields (unit, normal range and the flag as you type), or a text box when the test has none.
  let dlgKey = null;
  function resRows(c, x, ro) {
    const v = (x.entry && x.entry.values) || {}, head = `<div class="rt-h">${x.tube ? `<i class="tube" style="background:${x.tube.color}"></i>` : ""}<b>${esc(T(x.name))}</b><span class="code" style="font-size:11px;font-weight:700;color:#0b6b5c;background:#e3f4ee;padding:2px 7px;border-radius:6px;direction:ltr">${esc(x.code)}</span>${ro ? "" : cdOf(c, x)}</div>`;
    if (!x.an.length) return `<div class="rt">${head}${ro ? `<div class="tx" style="white-space:pre-line">${esc((x.entry || {}).text)}</div>` : `<p class="hint">${t().textHint}</p><div class="tx"><textarea data-tx="${esc(x.code)}" aria-label="${esc(t().textLbl)}" placeholder="${esc(t().textLbl)}">${esc((x.entry || {}).text || "")}</textarea></div>`}</div>`;
    return `<div class="rt">${head}<table><thead><tr><th>${t().test}</th><th>${t().result}</th><th class="hm">${t().unit}</th><th class="hm">${t().range}</th><th>${t().flag}</th></tr></thead><tbody>
      ${x.an.map(a => { const val = v[a.code], st = MadaSamples.labStatus(a, val);
        return `<tr><td>${esc(T(a.name))}</td><td>${ro ? `<span class="val num" dir="ltr">${esc(val)}</span>` : `<input inputmode="decimal" data-t="${esc(x.code)}" data-a="${esc(a.code)}" value="${val != null ? esc(val) : ""}" aria-label="${esc(T(a.name))}">`}</td>
          <td class="n hm">${esc(a.unit || "")}</td><td class="n hm">${esc(MadaSamples.rangeTxt(a))}</td><td><span class="pill ${st || ""}" data-st="${esc(x.code + ":" + a.code)}">${st ? t()["s_" + st] : "—"}</span></td></tr>`; }).join("")}</tbody></table></div>`;
  }
  function openRes(key, ro) {
    const c = MadaSamples.get(myId, key); if (!c) return;
    dlgKey = key; const doc = c.kind === "doctor", fl = ro ? MadaSamples.flag(c) : null;
    $("resDlg").innerHTML = `<button type="button" class="x" data-close aria-label="${t().close}">${S(I.x, 2)}</button>
      <div class="dh"><span class="ic">${S(I.flask)}</span><div><h3 id="resT">${ro ? t().viewT : t().resT}</h3><p>${ro ? esc(T(c.o.patient)) + ` · <span dir="ltr">${esc(c.o.mrn || "")}</span>` : esc(tx("resS", { p: T(c.o.patient) }))}</p></div></div>
      ${ro ? `<div class="sent-box">${S(I.ok, 2.2)}<span>${esc(doc ? tx("sentDoc", { d: docName(c), t: when(c.sentAt) }) : tx("sentTeam", { t: when(c.sentAt) }))}${c.sentBy ? `<br><small>${esc(tx("byN", { n: T(c.sentBy) }))}</small>` : ""}</span></div>${fl === "critical" ? `<div class="alert" style="margin:0 0 12px">${S(I.warn, 2)}<div><b>${t().critical}</b><span>${t().critWarn}</span></div></div>` : ""}` : ""}
      <div id="rtWrap">${c.tests.map(x => resRows(c, x, ro)).join("")}</div>
      ${repHtml(c, ro)}
      ${ro ? "" : `<div class="appr"><label><input type="checkbox" id="apOk"><span>${t().apprLbl}</span></label><p>${esc(doc ? tx("apprDoc", { d: docName(c) }) : t().apprTeam)}</p></div>
      <p class="err" id="resErr" hidden></p>`}
      <div class="df"><button type="button" class="btn btn-light" data-close>${t().cancel}</button>${ro ? "" : `<button type="button" class="btn btn-dark" id="resSave">${t().save}</button><button type="button" class="btn btn-go" id="resSend">${S(I.send)}${doc ? t().sendDoc : t().sendTeam}</button>`}</div>`;
    $("resOv").hidden = false;
    const first = $("resDlg").querySelector("input[data-t], textarea"); (first || $("resDlg").querySelector(".x")).focus();
  }
  // The lab report: the nurse downloads it from the lab system and uploads it here (or takes a photo). Needed before sending.
  function repHtml(c, ro) {
    const f = c.report, I2 = '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>';
    if (ro) return f ? `<div class="rep ok">${S(I2)}<div><b>${t().repT}</b><small>${esc(f.name)}</small></div>${MadaSamples.fileBtn(f, current)}</div>` : "";
    return `<div class="rep ${f ? "ok" : ""}" id="repBox">${S(f ? I.ok : I2, 2)}<div><b>${t().repT}</b><small>${f ? esc(f.name) + " · " + esc(when(f.at)) : t().repS}</small></div>
      <div class="rep-a">${f ? MadaSamples.fileBtn(f, current) : ""}<label class="btn ${f ? "btn-light" : "btn-dark"}">${S('<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>')}${f ? t().repRe : t().repUp}<input type="file" accept="application/pdf,image/*" data-rep hidden></label>
      <label class="btn btn-light">${S('<rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/>')}${t().repCam}<input type="file" accept="image/*" capture="environment" data-rep hidden></label></div></div>`;
  }
  $("resDlg").addEventListener("change", async e => {
    const inp = e.target.closest("[data-rep]"); if (!inp) return;
    const f = inp.files[0]; inp.value = ""; if (!f) return;
    if (!/^image\//.test(f.type) && f.type !== "application/pdf") return toast(t().repType);
    const key = dlgKey, ap = $("apOk") && $("apOk").checked;
    MadaSamples.saveDraft(myId, key, collect(), me.name);
    try { await MadaSamples.saveReport(myId, key, f, me.name); toast(t().repSaved); }
    catch (x) { toast(x.message === "big" ? t().repBig : t().repRoom); }
    openRes(key); if (ap && $("apOk")) $("apOk").checked = true;
  });
  // What is typed in the popup, as { CODE: { values } | { text } }.
  function collect() {
    const out = {};
    $("resDlg").querySelectorAll("input[data-t]").forEach(i => { const v = i.value.trim().replace(",", "."), e = out[i.dataset.t] = out[i.dataset.t] || { values: {} }; if (v !== "" && !isNaN(v)) e.values[i.dataset.a] = +v; });
    $("resDlg").querySelectorAll("textarea[data-tx]").forEach(i => out[i.dataset.tx] = { text: i.value.trim() });
    return out;
  }
  $("resDlg").addEventListener("input", e => {
    const i = e.target.closest("input[data-t]"); if (!i) return;
    const a = MadaSamples.analytes(i.dataset.t).find(y => y.code === i.dataset.a), v = i.value.trim().replace(",", "."), st = v !== "" && !isNaN(v) ? MadaSamples.labStatus(a, +v) : null;
    const p = $("resDlg").querySelector(`[data-st="${CSS.escape(i.dataset.t + ":" + i.dataset.a)}"]`); if (p) { p.className = "pill " + (st || ""); p.textContent = st ? t()["s_" + st] : "—"; }
    i.style.borderColor = v !== "" && isNaN(v) ? "#dc2626" : "";
  });
  $("resDlg").addEventListener("click", e => {
    if (e.target.closest("[data-close]")) return closeDlg("resOv");
    const err = $("resErr");
    if (e.target.closest("#resSave") || e.target.closest("#resSend")) {
      const send = !!e.target.closest("#resSend");
      if (send && !$("apOk").checked) { err.textContent = t().needAppr; err.hidden = false; return; }
      MadaSamples.saveDraft(myId, dlgKey, collect(), me.name);
      const c = MadaSamples.get(myId, dlgKey);
      if (!send) { closeDlg("resOv"); render(); return toast(t().saved); }
      const miss = c.tests.filter(x => !x.entered);
      if (miss.length) { err.textContent = tx("needAll", { s: miss.map(x => T(x.name)).join(current === "ar" ? "، " : ", ") }); err.hidden = false; render(); return; }
      if (!c.report) { err.textContent = t().needRep; err.hidden = false; $("repBox").classList.add("bad"); $("repBox").scrollIntoView({ block: "center", behavior: "smooth" }); render(); return; }
      const done = MadaSamples.send(myId, dlgKey, me.name);
      closeDlg("resOv"); tab = "todo"; render();
      toast(c.kind === "doctor" ? tx("sentToastDoc", { d: docName(c) }) : t().sentToastTeam);
      if (done && MadaSamples.flag(done) === "critical") setTimeout(() => openRes(done.key, true), 300);
    }
  });
  // Doctor's order whose sample was not marked on the visit: the nurse sets the time she took it.
  function openCol(key) {
    dlgKey = key; const n = new Date(), v = String(n.getHours()).padStart(2, "0") + ":" + String(n.getMinutes()).padStart(2, "0");
    $("colDlg").innerHTML = `<button type="button" class="x" data-close aria-label="${t().close}">${S(I.x, 2)}</button>
      <div class="dh"><span class="ic">${S(I.drop)}</span><div><h3 id="colT">${t().colT}</h3><p>${t().colS}</p></div></div>
      <label class="fld">${t().colTime}<input type="time" id="colTime" value="${v}"></label><p class="err" id="colErr" hidden></p>
      <div class="df"><button type="button" class="btn btn-light" data-close>${t().cancel}</button><button type="button" class="btn btn-go" id="colSave">${t().colSave}</button></div>`;
    $("colOv").hidden = false; $("colTime").focus();
  }
  $("colDlg").addEventListener("click", e => {
    if (e.target.closest("[data-close]")) return closeDlg("colOv");
    if (!e.target.closest("#colSave")) return;
    const v = $("colTime").value; if (!v) { $("colErr").textContent = t().needTime; $("colErr").hidden = false; return; }
    const d = new Date(), [h, m] = v.split(":"); d.setHours(+h, +m, 0, 0); if (d > new Date()) d.setDate(d.getDate() - 1);
    MadaSamples.markCollected(myId, dlgKey, d.toISOString(), me.name); closeDlg("colOv"); render(); toast(t().colDone);
  });
  function closeDlg(id) { $(id).hidden = true; dlgKey = null; }
  document.querySelectorAll(".ov").forEach(ov => ov.addEventListener("click", e => { if (e.target === ov) closeDlg(ov.id); }));
  document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".ov:not([hidden])").forEach(ov => closeDlg(ov.id)); });

  $("list").addEventListener("click", e => {
    const r = e.target.closest("[data-res]"), v = e.target.closest("[data-view]"), c = e.target.closest("[data-col]");
    if (r) openRes(r.dataset.res); else if (v) openRes(v.dataset.view, true); else if (c) openCol(c.dataset.col);
  });
  $("stats").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (!b) return; kind = kind === b.dataset.k ? "" : b.dataset.k; tab = "todo"; render(); });
  $("vtabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (!b) return; tab = b.dataset.tab; kind = ""; render(); });
  $("q").addEventListener("input", render);
  addEventListener("resize", () => { clearTimeout(render.r); render.r = setTimeout(render, 150); });
  $("alerts").addEventListener("click", e => {
    if (!e.target.closest("#ntfOn")) return;
    Notification.requestPermission().then(p => { toast(p === "granted" ? t().ntfDone : t().ntfNo); render(); });
  });
  // The countdowns move on their own; the list refreshes every 30 seconds and when another tab changes the data.
  setInterval(() => { if ($("resOv").hidden && $("colOv").hidden) render(); }, 30000);
  window.addEventListener("storage", e => { if ((!e.key || ["mada-orders", "mada-medical"].includes(e.key)) && $("resOv").hidden) render(); });
  document.addEventListener("click", e => { if (e.target.closest("[data-soon]")) { e.preventDefault(); toast(t().soonMsg); } });
  function toast(msg) { const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3200); }

  function setLang(lang) {
    current = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t()[el.dataset.i18n]);
    document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t()[el.dataset.i18nPh]);
    document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t()[el.dataset.i18nAria]));
    document.title = lang === "ar" ? "مدى كير | العينات" : "Mada Care | Samples";
    DrPortal.render(me, lang, "samples"); render();
    try { localStorage.setItem("mada-lang", lang); } catch (e) {}
  }
  $("langToggle").addEventListener("click", () => setLang(current === "en" ? "ar" : "en"));
  const user = $("user"), userBtn = $("userBtn");
  userBtn.addEventListener("click", e => { e.stopPropagation(); userBtn.setAttribute("aria-expanded", user.classList.toggle("open")); });
  document.addEventListener("click", () => { user.classList.remove("open"); userBtn.setAttribute("aria-expanded", false); });
  $("logout").addEventListener("click", e => { e.preventDefault(); MadaAuth.logout(); });

  let saved = "en";
  try { saved = localStorage.getItem("mada-lang") || "en"; } catch (e) {}
  setLang(saved);
  // From the bell or a reminder: ?k= opens that sample.
  { const k = new URLSearchParams(location.search).get("k"), c = k && MadaSamples.get(myId, k);
    if (c) { openKey = k; tab = c.status === "sent" ? "sent" : "todo"; render();
      const el = document.getElementById("c-" + k.replace(/[^\w-]/g, "_")); if (el) el.scrollIntoView({ block: "center" });
      if (c.status === "due" || c.status === "ready") openRes(k); } }
</script>
</body>
</html>
