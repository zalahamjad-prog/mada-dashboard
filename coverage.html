<style>
  :root {
    --primary: #0b6b5c;
    --primary-dark: #08584b;
    --primary-soft: #e6f3ef;
    --ink: #10232b;
    --muted: #6b7a80;
    --border: #e3e8ea;
    --page: #f5f7f8;
    --card: #ffffff;
    --red: #dc2626; --red-soft: #fdecec;
    --orange: #d97706; --orange-soft: #fef3e2;
    --blue: #3b82f6; --blue-soft: #e8f0fe;
    --purple: #7c3aed; --purple-soft: #f1eafe;
    --green: #15803d; --green-soft: #e7f6ec;
    --font: "Inter", "Tajawal", system-ui, sans-serif;
  }
  [dir="rtl"] { --font: "Tajawal", "Inter", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--page); color: var(--ink); min-height: 100vh; }
  button, input, select { font: inherit; color: inherit; }
  svg { flex-shrink: 0; }
  [hidden] { display: none !important; }

  /* ---------- Top bar ---------- */
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 20px; height: 68px; padding: 0 28px; background: #fff; border-bottom: 1px solid var(--border); }
  .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
  .logo img { width: auto; height: 40px; }
  .logo-name { font-size: 17px; font-weight: 600; line-height: 1.1; }
  .logo-tag { font-size: 10.5px; color: var(--primary); }
  .nav { display: flex; gap: 4px; margin-inline-start: 18px; }
  .nav a { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: #44545a; text-decoration: none; }
  .nav a:hover { background: #f1f4f5; }
  .nav a[aria-current="page"] { background: var(--primary-soft); color: var(--primary); }
  .nav-count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 10.5px; font-weight: 600; line-height: 18px; text-align: center; }
  .top-actions { margin-inline-start: auto; display: flex; align-items: center; gap: 10px; }
  .lang-btn { display: flex; align-items: center; gap: 6px; background: none; border: 0; cursor: pointer; font-size: 13px; color: #44545a; padding: 8px; border-radius: 8px; }
  .lang-btn:hover { background: #f1f4f5; }
  .user { position: relative; }
  .user-btn { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 4px 6px; border-radius: 10px; text-align: start; }
  .user-btn:hover { background: #f1f4f5; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
  .user-name { display: block; font-size: 13px; font-weight: 600; }
  .user-role { display: block; font-size: 11px; color: var(--muted); }
  .user-menu { position: absolute; top: 110%; inset-inline-end: 0; min-width: 170px; background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(16,35,43,.08); padding: 6px; display: none; }
  .user.open .user-menu { display: block; }
  .user-menu a { display: block; padding: 9px 10px; border-radius: 6px; font-size: 13px; color: var(--ink); text-decoration: none; }
  .user-menu a:hover { background: var(--primary-soft); color: var(--primary); }

  main { max-width: 1320px; margin: 0 auto; padding: 24px 28px 40px; display: grid; gap: 18px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .page-head h1 { font-size: 24px; font-weight: 600; }
  .page-head p { margin-top: 4px; font-size: 13.5px; color: var(--muted); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; font-size: 13.5px; font-weight: 500; text-decoration: none; white-space: nowrap; }
  .btn svg { width: 17px; height: 17px; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-ghost { background: #fff; color: var(--ink); border-color: #d9e1e3; }
  .btn-ghost:hover { background: #f5f8f8; }

  const IC = { plus: '<path d="M12 5v14M5 12h14"/>', trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 7 4 4"/>',
    shape: '<path d="M5 6l9-2 6 7-5 9-10-3z"/><circle cx="5" cy="6" r="1.6"/><circle cx="14" cy="4" r="1.6"/><circle cx="20" cy="11" r="1.6"/><circle cx="15" cy="20" r="1.6"/><circle cx="5" cy="17" r="1.6"/>',
    check: '<path d="m5 12 5 5 9-10"/>', undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>', x: '<path d="M6 6l12 12M18 6 6 18"/>', pin: '<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>', map: '<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>' };
  // Rough area for the list (flat-earth approximation is fine at district size).
  function areaKm(poly) {
    const k = Math.cos(poly[0][0] * Math.PI / 180) * 111.32; let a = 0;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) a += (poly[j][1] * k) * (poly[i][0] * 110.57) - (poly[i][1] * k) * (poly[j][0] * 110.57);
    return Math.abs(a / 2);
  }

  // ---------- Map ----------
  const map = L.map("map", { zoomControl: true, attributionControl: true }).setView(CITY.center, 11);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(map);
  L.polygon(CITY.polygon, { color: "#6b7a80", weight: 1.5, dashArray: "6 6", fill: false, interactive: false }).addTo(map);
  // The side menu and screen size change the map box without a window resize.
  if (window.ResizeObserver) new ResizeObserver(() => map.invalidateSize()).observe($("map"));
  const zl = L.layerGroup().addTo(map), dl = L.layerGroup().addTo(map);
  let shapes = {};
  function paintMap() {
    zl.clearLayers(); shapes = {};
    list.forEach(z => {
      if (draw && draw.id === z.id) return;
      const c = color(z), p = L.polygon(z.polygon, z.active ? { color: c, weight: sel === z.id ? 3.5 : 2, fillColor: c, fillOpacity: sel === z.id ? .32 : .2 }
        : { color: "#8a979c", weight: sel === z.id ? 3 : 1.6, dashArray: "5 5", fillColor: "#8a979c", fillOpacity: .08 });
      p.bindTooltip(esc(nm(z)), { permanent: true, direction: "center", className: "zl" + (z.active ? "" : " off") });
      p.on("click", e => { if (draw) return; L.DomEvent.stopPropagation(e); pick(z.id, false); check(e.latlng); });
      p.addTo(zl); shapes[z.id] = p;
    });
  }
  function paintDraft() {
    dl.clearLayers(); if (!draw) return;
    const pts = draw.pts;
    if (pts.length > 1) L.polygon(pts, { color: "#0b6b5c", weight: 2.5, dashArray: "6 5", fillColor: "#0b6b5c", fillOpacity: pts.length > 2 ? .15 : 0, interactive: false }).addTo(dl);
    pts.forEach((p, i) => {
      const m = L.circleMarker(p, { radius: i ? 6 : 8, color: "#fff", weight: 2.5, fillColor: "#0b6b5c", fillOpacity: 1 }).addTo(dl);
      // Tapping the first point closes the shape.
      if (!i) m.on("click", e => { L.DomEvent.stopPropagation(e); if (draw.pts.length > 2) finish(); });
    });
  }
  // Outside drawing, a tap on the map says whether that spot is covered.
  function check(ll) {
    const hit = MadaOrders.coverageAt(ll.lat, ll.lng), z = hit && hit.zone;
    const html = `<div class="cv-pop"><b><i style="background:${hit ? "var(--green)" : "var(--red)"}"></i>${hit ? (z ? t().inZone : t().inCity) : t().outZone}</b>${z ? `<small>${esc(tx("byZone", { n: nm(z) }))}</small>` : ""}</div>`;
    L.popup({ closeButton: false, autoPan: false }).setLatLng(ll).setContent(html).openOn(map);
  }
  map.on("click", e => {
    if (!draw) return check(e.latlng);
    draw.pts.push([+e.latlng.lat.toFixed(6), +e.latlng.lng.toFixed(6)]); paintDraft(); bar();
  });

  // ---------- Drawing ----------
  function start(id) {
    if (draw) return;
    map.closePopup(); draw = { id: id || null, pts: [] }; sel = id || null;
    $("map").classList.add("drawing"); paintMap(); paintDraft(); bar(); renderList();
    if (id) { const z = list.find(x => x.id === id); map.fitBounds(L.latLngBounds(z.polygon), { padding: [60, 60], maxZoom: 15 }); }
  }
  function stop() { draw = null; $("map").classList.remove("drawing"); dl.clearLayers(); bar(); paintMap(); renderList(); }
  function bar() {
    const b = $("bar"); b.hidden = !draw; if (!draw) return;
    const z = draw.id && list.find(x => x.id === draw.id);
    b.innerHTML = `<p>${svg(IC.pin, 2)}${z ? esc(tx("redrawHint", { n: nm(z) })) : t().drawHint} <b>${draw.pts.length}</b></p>
      <button type="button" class="btn btn-ghost" id="bUndo" ${draw.pts.length ? "" : "disabled"}>${svg(IC.undo, 2)}${t().undo}</button>
      <button type="button" class="btn btn-ghost" id="bX">${t().cancel}</button>
      <button type="button" class="btn btn-primary" id="bOk" ${draw.pts.length > 2 ? "" : "disabled"}>${svg(IC.check, 2.2)}${t().done}</button>`;
  }
  $("bar").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    if (b.id === "bUndo") { draw.pts.pop(); paintDraft(); bar(); }
    else if (b.id === "bX") stop();
    else if (b.id === "bOk") finish();
  });
  L.DomEvent.disableClickPropagation($("bar")); L.DomEvent.disableClickPropagation($("legend"));
  function finish() {
    if (!draw || draw.pts.length < 3) return;
    if (draw.id) {
      const z = list.find(x => x.id === draw.id); z.polygon = draw.pts; z.updatedAt = new Date().toISOString();
      if (!store()) return; sel = z.id; stop(); toast(tx("updated", { n: nm(z) })); return;
    }
    openForm(null);
  }

  // ---------- Name form ----------
  function openForm(z) {
    editing = z; tried = false;
    $("mdT").textContent = z ? t().editT : t().newT; $("mdS").textContent = t().newS;
    $("lAr").textContent = t().nameAr; $("lEn").innerHTML = `${t().nameEn} <i>${t().optional}</i>`; $("lOn").textContent = t().activeL;
    $("mdX").textContent = t().close; $("mdOk").textContent = t().save;
    const used = new Set(list.filter(x => x !== z).map(x => x.name.ar));
    $("sugAr").innerHTML = NAMES.filter(n => !used.has(n[0])).map(n => `<option value="${esc(n[0])}"></option>`).join("");
    $("sugEn").innerHTML = NAMES.filter(n => !used.has(n[0])).map(n => `<option value="${esc(n[1])}"></option>`).join("");
    $("nAr").value = z ? z.name.ar : ""; $("nEn").value = z ? z.name.en : ""; $("nOn").checked = z ? z.active : true; $("nAr").dataset.auto = $("nEn").dataset.auto = "";
    formErr(); $("ov").hidden = false; setTimeout(() => $("nAr").focus(), 30);
  }
  function closeForm() { $("ov").hidden = true; if (draw && !draw.id && !editing) stop(); editing = null; }
  function formErr() {
    const ar = $("nAr").value.trim(), dup = ar && list.some(x => x !== editing && x.name.ar === ar), msg = !tried ? "" : !ar ? t().errAr : dup ? t().errDup : "";
    $("eAr").hidden = !msg; $("eAr").textContent = msg; $("nAr").classList.toggle("bad", !!msg);
    return !(!ar || dup);
  }
  // Picking a suggested name fills the other language.
  // A name filled this way keeps following the other field until the admin types in it.
  const fill = (to, v) => { const f = $(to); if (!f.value.trim() || f.value === f.dataset.auto) { f.value = v; f.dataset.auto = v; } };
  $("nAr").addEventListener("input", () => { const n = NAMES.find(x => x[0] === $("nAr").value.trim()); fill("nEn", n ? n[1] : ""); $("nAr").dataset.auto = ""; if (tried) formErr(); });
  $("nEn").addEventListener("input", () => { const n = NAMES.find(x => x[1].toLowerCase() === $("nEn").value.trim().toLowerCase()); fill("nAr", n ? n[0] : ""); $("nEn").dataset.auto = ""; if (tried) formErr(); });
  $("mdX").addEventListener("click", closeForm);
  $("ov").addEventListener("click", e => { if (e.target === $("ov")) closeForm(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("ov").hidden) closeForm(); });
  $("md").addEventListener("submit", e => {
    e.preventDefault(); tried = true; if (!formErr()) return $("nAr").focus();
    const name = { ar: $("nAr").value.trim(), en: $("nEn").value.trim() }, active = $("nOn").checked;
    let z = editing, msg;
    if (z) { Object.assign(z, { name, active, updatedAt: new Date().toISOString() }); msg = "updated"; }
    else { z = { id: "Z-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), city: CITY.id, name, polygon: draw.pts, active, createdAt: new Date().toISOString(), by: me ? me.name : null }; list.push(z); msg = "saved"; }
    if (!store()) { if (msg === "saved") list.pop(); return; }
    $("ov").hidden = true; editing = null; sel = z.id;
    if (draw) stop(); else { paintMap(); renderList(); }
    toast(tx(msg, { n: nm(z) }));
  });

  // ---------- List ----------
  function store() {
    try { MadaOrders.saveZones(list); if (MadaOrders.zones().length !== list.length) throw 0; return true; }
    catch (e) { list = MadaOrders.zones(); toast(t().storeErr); return false; }
  }
  function renderList() {
    const act = list.filter(z => z.active).length;
    $("sum").className = "card cv-sum " + (act ? "on" : "all");
    $("sum").innerHTML = `${svg(act ? IC.check : IC.info, 2.2)}<div><b>${act ? (act === 1 ? t().sumOn1 : tx("sumOnT", { n: act })) : t().sumAllT}</b>${act ? t().sumOn : t().sumAll}</div>`;
    $("listH").innerHTML = `${t().districts} <span>(${list.length})</span>`;
    $("addBtn").innerHTML = `${svg(IC.plus, 2.2)}${t().add}`; $("addBtn").disabled = !!draw;
    $("legend").innerHTML = `<span><i class="lg-on"></i>${t().lgOn}</span><span><i class="lg-off"></i>${t().lgOff}</span><span><i class="lg-city"></i>${t().lgCity}</span>`;
    $("list").innerHTML = !list.length ? `<div class="zn-empty">${svg(IC.map, 1.6)}<b>${t().emptyT}</b>${t().empty}</div>`
      : list.map(z => `<div class="zn ${z.active ? "" : "off"} ${sel === z.id ? "sel" : ""}" data-id="${z.id}">
        <span class="zn-sw" style="background:${color(z)}33;border:1.5px solid ${color(z)}"></span>
        <div class="zn-tx"><b>${esc(nm(z))}</b><small>${[other(z), tx("km", { a: num(areaKm(z.polygon)) }), z.active ? t().on : t().off].filter(Boolean).map(x => `<bdi>${esc(x)}</bdi>`).join(" · ")}</small></div>
        <div class="zn-a">
          <button type="button" class="ib" data-act="edit" title="${t().edit}" aria-label="${t().edit}" ${draw ? "disabled" : ""}>${svg(IC.pen, 2)}</button>
          <button type="button" class="ib" data-act="redraw" title="${t().redraw}" aria-label="${t().redraw}" ${draw ? "disabled" : ""}>${svg(IC.shape, 1.8)}</button>
          <button type="button" class="ib red" data-act="del" title="${t().del}" aria-label="${t().del}" ${draw ? "disabled" : ""}>${svg(IC.trash, 2)}</button>
        </div>
        <label class="sw" title="${z.active ? t().on : t().off}"><input type="checkbox" data-act="on" ${z.active ? "checked" : ""} ${draw ? "disabled" : ""} aria-label="${esc(nm(z))}: ${t().on}"><span></span></label></div>`).join("");
  }
  function pick(id, zoom) {
    sel = id; paintMap(); renderList();
    if (zoom && shapes[id]) map.fitBounds(shapes[id].getBounds(), { padding: [60, 60], maxZoom: 15 });
    const el = document.querySelector(`.zn[data-id="${id}"]`); if (el && !zoom) el.scrollIntoView({ block: "nearest" });
  }
  $("list").addEventListener("change", e => {
    const i = e.target.closest('[data-act="on"]'); if (!i) return;
    const z = list.find(x => x.id === i.closest(".zn").dataset.id); z.active = i.checked; z.updatedAt = new Date().toISOString();
    if (!store()) return renderList();
    paintMap(); renderList(); toast(tx(z.active ? "nowOn" : "nowOff", { n: nm(z) }));
  });
  $("list").addEventListener("click", e => {
    const row = e.target.closest(".zn"); if (!row || e.target.closest(".sw")) return;
    const z = list.find(x => x.id === row.dataset.id), b = e.target.closest("button");
    if (!b) return draw || pick(z.id, true);
    if (b.dataset.act === "edit") openForm(z);
    else if (b.dataset.act === "redraw") start(z.id);
    else if (b.dataset.act === "del") {
      if (!confirm(tx("delQ", { n: nm(z) }))) return;
      list = list.filter(x => x !== z); if (sel === z.id) sel = null;
      if (!store()) return; map.closePopup(); paintMap(); renderList(); toast(tx("removed", { n: nm(z) }));
    }
  });
  $("addBtn").addEventListener("click", () => start(null));
  // Another admin saved zones (cloud sync): reload unless this page is mid-edit.
  window.addEventListener("storage", e => { if ((!e.key || e.key === "mada-coverage") && !draw && $("ov").hidden) { list = MadaOrders.zones(); paintMap(); renderList(); } });
  window.addEventListener("beforeunload", e => { if (draw && draw.pts.length) { e.preventDefault(); e.returnValue = ""; } });
  function toast(msg) { const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3200); }

  function setLang(lang) {
    current = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t()[el.dataset.i18n]);
    if (me) { $("userName").textContent = me.name[lang]; $("userRole").textContent = me.role[lang]; $("avatar").textContent = me.initials[lang]; }
    document.title = lang === "ar" ? "مدى كير | التغطية" : "Mada Care | Coverage";
    try { localStorage.setItem("mada-lang", lang); } catch (e) {}
    map.closePopup(); paintMap(); bar(); renderList();
    if (!$("ov").hidden) openForm(editing);
  }
  $("langToggle").addEventListener("click", () => setLang(current === "en" ? "ar" : "en"));
  const user = $("user"), userBtn = $("userBtn");
  userBtn.addEventListener("click", e => { e.stopPropagation(); userBtn.setAttribute("aria-expanded", user.classList.toggle("open")); });
  document.addEventListener("click", () => { user.classList.remove("open"); userBtn.setAttribute("aria-expanded", false); });
  $("logout").addEventListener("click", e => { e.preventDefault(); MadaAuth.logout(); });
  { const n = MadaOrders.needsAction(), c = $("navCount"); c.hidden = !n; c.textContent = n; }

  list = MadaOrders.zones();
  if (list.length) setTimeout(() => map.fitBounds(L.latLngBounds(list.flatMap(z => z.polygon)), { padding: [40, 40], maxZoom: 14 }), 0);
  let saved = "en";
  try { saved = localStorage.getItem("mada-lang") || "en"; } catch (e) {}
  setLang(saved);
</script>
</body>
</html>
