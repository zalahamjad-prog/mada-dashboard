<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/mada-logo.png">
<title>مدى كير | ملفك الطبي</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="مدى كير | Mada Care">
<meta property="og:title" content="مدى كير | ملفك الطبي">
<meta property="og:description" content="ملفك من مدى كير: الوصفات والأشعة والتحاليل وتقارير الطبيب. نرعاكم كأهلنا 💚">
<meta property="og:image" content="https://zalahamjad-prog.github.io/mada-dashboard/assets/og-visit.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="960">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --g: #0b6b5c; --gd: #07463d; --gold: #c8a45a; --ink: #10232b; --mu: #6b7a80; --line: #e3e8ea; --soft: #f4f8f7; --bg: #f3f6f6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Tajawal, Inter, Arial, sans-serif; font-size: 15px; -webkit-font-smoothing: antialiased; }
  html[lang="en"] body { font-family: Inter, Tajawal, Arial, sans-serif; }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  .hero { background: linear-gradient(130deg, var(--gd), var(--g)); color: #fff; padding: 18px 16px 64px; border-radius: 0 0 28px 28px; }
  .top { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .logo { width: 48px; height: 48px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 0 0 3px rgba(200,164,90,.55); flex: none; }
  .logo img { height: 32px; }
  .brand { flex: 1; } .brand b { display: block; font-size: 18px; } .brand small { opacity: .85; font-size: 12.5px; }
  .lang { border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.1); color: #fff; border-radius: 20px; padding: 7px 14px; font: inherit; font-size: 13.5px; cursor: pointer; }
  .hero h1 { max-width: 560px; margin: 22px auto 4px; font-size: 24px; }
  .hero p { max-width: 560px; margin: 0 auto; opacity: .88; font-size: 14.5px; line-height: 1.6; }
  main { max-width: 560px; margin: -44px auto 0; padding: 0 16px 40px; }
  .card { background: #fff; border-radius: 18px; border: 1px solid var(--line); box-shadow: 0 8px 26px rgba(16,35,43,.06); padding: 18px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 12px; font-size: 17px; display: flex; align-items: center; gap: 10px; }
  .ic { width: 34px; height: 34px; border-radius: 10px; background: #e6f3ef; color: var(--g); display: grid; place-items: center; flex: none; }
  .ic svg { width: 18px; height: 18px; }
  .rows { display: grid; gap: 10px; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; } .row span { color: var(--mu); } .row b { text-align: end; }
  .state { text-align: center; padding: 28px 18px; }
  .state .big { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 12px; background: #e7f6ec; color: #15803d; }
  .state.bad .big { background: #fdecec; color: #dc2626; } .state.wait .big { background: #eef4f5; color: var(--mu); }
  .state .big svg { width: 30px; height: 30px; } .state h2 { justify-content: center; margin-bottom: 6px; } .state p { color: var(--mu); margin: 0; line-height: 1.6; }
  .foot { text-align: center; color: var(--mu); font-size: 12.5px; margin-top: 18px; }
  .ov { position: fixed; inset: 0; background: rgba(16,35,43,.55); display: grid; place-items: center; z-index: 9; color: #fff; font-weight: 700; }
  .spin { width: 42px; height: 42px; border-radius: 50%; border: 4px solid rgba(255,255,255,.35); border-top-color: #fff; animation: r 1s linear infinite; margin: 0 auto 12px; }
  .ov[hidden] { display: none; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #10232b; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 10; max-width: calc(100% - 32px); }
  .toast[hidden] { display: none; }
  @keyframes r { to { transform: rotate(360deg); } }

  .pt { display: flex; align-items: center; gap: 12px; }
  .ava { width: 46px; height: 46px; border-radius: 50%; background: #e6f3ef; color: var(--g); font-weight: 800; display: grid; place-items: center; font-size: 16px; flex: none; }
  .pt b { display: block; font-size: 17px; } .pt small { color: var(--mu); font-size: 13px; }
  .all { width: 100%; height: 52px; border: 0; border-radius: 14px; background: var(--g); color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 10px 22px rgba(11,107,92,.22); }
  .all svg { width: 19px; height: 19px; } .all:disabled { opacity: .6; }
  .nb { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: #eef4f3; color: var(--g); font-size: 12px; line-height: 22px; text-align: center; margin-inline-start: auto; }
  .fl { list-style: none; margin: 0; padding: 0; }
  .fl li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #eef2f3; }
  .fl li:first-child { border-top: 0; padding-top: 2px; }
  .fl .tx { flex: 1; min-width: 0; } .fl b { display: block; font-size: 14.5px; line-height: 1.45; } .fl small { display: block; color: var(--mu); font-size: 12.5px; margin-top: 3px; }
  .fl .new { display: inline-block; margin-inline-start: 6px; padding: 1px 8px; border-radius: 10px; background: #fdf4e3; color: #9a5a00; font-size: 11px; font-weight: 700; vertical-align: 1px; }
  .dl { flex: none; height: 40px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--g); background: #fff; color: var(--g); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .dl svg { width: 17px; height: 17px; } .dl:disabled { opacity: .5; }
  .ic.rx { background: #fdf0e6; color: #b8521a; } .ic.rad { background: #efeafd; color: #6d3fd1; } .ic.lab { background: #fdf4e3; color: #9a6b12; } .ic.rep { background: #e8f0fb; color: #1b5fae; }
  .note { font-size: 12.5px; color: var(--mu); text-align: center; margin: 4px 8px 0; line-height: 1.6; }
</style>
</head>
<body>
<header class="hero">
  <div class="top"><span class="logo"><img src="assets/mada-logo.png" alt=""></span><div class="brand"><b id="brand">مدى كير</b><small id="tag">رعاية كالعائلة</small></div><button type="button" class="lang" id="langBtn">English</button></div>
  <h1 id="hTitle"></h1><p id="hSub"></p>
</header>
<main id="main"></main>
<div class="toast" id="toast" hidden></div>
<script src="auth.js"></script>
<script src="nurses.js"></script>
<script src="orders.js"></script>
<script src="patients.js"></script>
<script src="medical.js"></script>
<script src="labs.js"></script>
<script src="lab-samples.js"></script>
<script src="lab-report.js"></script>
<script src="providers.js"></script>
<script src="rad-report.js"></script>
<script src="doctor-history.js"></script>
<script src="doctor-exam.js"></script>
<script src="doctor-allergy.js"></script>
<script src="doctor-plan.js"></script>
<script src="doctor-orders.js"></script>
<script src="doctor-nurse.js"></script>
<script src="doctor-edu.js"></script>
<script src="doctor-idform.js"></script>
<script src="stamps.js"></script>
<script src="medical-report.js"></script>
<script src="patient-docs.js"></script>
<script>
  // The patient's file, opened from the link the operations team sends (patient.html > Files & Patient Link).
  // records.html?t=<token>&l=ar|en. The token is patient.shareLink.token (random 128-bit). Shows only what the team left on for the
  // patient: prescriptions, imaging reports, lab results and medical reports, each downloaded as the same PDF the team sends.
  // TODO: patient data, so test files only until logins use Supabase Auth; the server must then return only this patient's files for the token.
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const qs = new URLSearchParams(location.search), token = qs.get("t") || "";
  const svg = (p, w) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w || 2}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const IC = { rx: '<rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-45 12 12)"/><path d="m9.5 9.5 5 5"/>', rad: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="3.5"/>',
    lab: '<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/>', rep: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
    dl: '<path d="M12 4v12M7 11l5 5 5-5M4 20h16"/>', x: '<path d="M6 6l12 12M18 6 6 18"/>', clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>' };
  const L = {
    ar: { brand: "مدى كير", tag: "رعاية كالعائلة", other: "English", title: "ملفك الطبي", sub: "هنا وصفاتك وتقاريرك من مدى كير. تقدر تشوفها وتحمّلها في أي وقت، وتشاركها مع أي طبيب أو مستشفى.",
      fileNo: "رقم الملف", all: "تحميل كل الملفات ({n})", g_rx: "الوصفات الطبية", g_rad: "تقارير الأشعة", g_lab: "نتائج التحاليل", g_rep: "التقارير الطبية", dl: "تحميل",
      rxItem: "وصفة طبية · {n} أدوية", rxItem1: "وصفة طبية · دواء واحد", repItem: "التقرير الطبي للزيارة", byDr: "{d} · {n}", upd: "محدّثة",
      emptyT: "ما فيه ملفات للحين", emptyS: "أول ما تجهز تقاريرك تظهر هنا على نفس الرابط.", loading: "جاري تحميل ملفك…", badT: "الرابط غير صالح", badS: "تأكد من الرابط اللي وصلك، أو تواصل مع فريق مدى كير.",
      making: "جاري تجهيز الملف…", allNote: "إذا سألك المتصفح، اسمح بتحميل أكثر من ملف.", thanks: "نتمنى لك الصحة والعافية 💚" },
    en: { brand: "Mada Care", tag: "Caring Like Family", other: "العربية", title: "Your Medical File", sub: "Your prescriptions and reports from Mada Care. View and download them any time, and share them with any doctor or hospital.",
      fileNo: "File No.", all: "Download all files ({n})", g_rx: "Prescriptions", g_rad: "Imaging Reports", g_lab: "Lab Results", g_rep: "Medical Reports", dl: "Download",
      rxItem: "Prescription · {n} medicines", rxItem1: "Prescription · 1 medicine", repItem: "Visit medical report", byDr: "{d} · {n}", upd: "Updated",
      emptyT: "No files yet", emptyS: "Your reports show here on this same link as soon as they are ready.", loading: "Loading your file…", badT: "This link is not valid", badS: "Check the link you received, or contact the Mada Care team.",
      making: "Preparing the file…", allNote: "If your browser asks, allow it to download several files.", thanks: "Wishing you good health 💚" }
  };
  let lang = qs.get("l") === "en" ? "en" : "ar", started = Date.now(), tracked = false, busy = false;
  const t = () => L[lang], tx = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k]);
  const T = v => v && typeof v === "object" ? v[lang] || v.en || v.ar || "" : v || "";
  const fmtD = s => { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleDateString(lang === "ar" ? "ar-SA-u-nu-latn-ca-gregory" : "en-GB", { day: "numeric", month: "long", year: "numeric" }); };
  const drOf = o => { const d = (MadaOrders.DOCTORS || []).find(x => x.id === (o.booking && o.booking.doctorId)); return d ? T(d.name) : T((o.doctorVisit || {}).by); };
  const state = (k, icon, h, p) => `<section class="card state ${k}"><div class="big">${svg(icon, 2.4)}</div><h2>${h}</h2><p>${p}</p></section>`;
  function toast(m) { const el = $("toast"); if (!m) { el.hidden = true; return; } el.textContent = m; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { el.hidden = true; }, 3000); }
  function rowOf(g, x) {
    let title, sub, tag = "";
    if (g === "rx") { const n = x.o.doctorVisit.steps.plan.meds.length; title = n === 1 ? t().rxItem1 : tx(t().rxItem, { n }); sub = [fmtD(x.at), drOf(x.o)].filter(Boolean).join(" · "); if (x.amended) tag = t().upd; }
    else if (g === "rad") { title = T(x.it.title); const sc = (x.it.log || []).find(l => MadaMedical.STEPS.radiology[l.step] === "scheduled"); sub = [fmtD(x.at), sc && sc.data && T(sc.data.center)].filter(Boolean).join(" · "); }
    else if (g === "lab") { title = x.c.tests.map(z => T(z.name)).join(lang === "ar" ? "، " : ", "); sub = fmtD(x.at); }
    else { title = t().repItem; sub = [fmtD(x.at), drOf(x.o)].filter(Boolean).join(" · "); }
    return `<li><span class="ic ${g}">${svg(IC[g])}</span><span class="tx"><b>${esc(title)}${tag ? `<span class="new">${esc(tag)}</span>` : ""}</b><small>${esc(sub)}</small></span>
      <button type="button" class="dl" data-dl="${g}|${esc(x.key)}">${svg(IC.dl)}${t().dl}</button></li>`;
  }
  const docs = p => MadaPatientDocs.shown(p.fileNo, p.shareLink);
  function track(p) {
    if (tracked) return; tracked = true;
    try { if (sessionStorage.getItem("mada-rec-" + token)) return; sessionStorage.setItem("mada-rec-" + token, "1"); } catch (e) {}
    try { MadaPatientDocs.setLink(p.fileNo, { opens: (p.shareLink.opens || 0) + 1, lastOpenAt: new Date().toISOString() }); } catch (e) {}
  }
  function render() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = lang === "ar" ? "مدى كير | ملفك الطبي" : "Mada Care | Your medical file";
    $("brand").textContent = t().brand; $("tag").textContent = t().tag; $("langBtn").textContent = t().other;
    $("hTitle").textContent = t().title; $("hSub").textContent = t().sub;
    const p = MadaPatientDocs.find(token);
    if (!p) {
      // A new device has nothing stored yet: wait for the shared data before saying the link is not valid.
      const wait = token.length >= 32 && Date.now() - started < 10000;
      $("main").innerHTML = wait ? state("wait", IC.clock, t().loading, "") : state("bad", IC.x, t().badT, t().badS);
      if (wait) setTimeout(render, 1500);
      return;
    }
    track(p);
    const c = docs(p), n = MadaPatientDocs.count(c), name = T(p.name);
    const ini = (name || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("");
    $("main").innerHTML = `<section class="card"><div class="pt"><span class="ava">${esc(ini)}</span><div><b>${esc(name)}</b><small>${t().fileNo}: <span class="ltr">${esc(p.fileNo)}</span></small></div></div>
        ${n ? `<button type="button" class="all" id="dlAll">${svg(IC.dl)}${esc(tx(t().all, { n }))}</button>` : ""}</section>
      ${n ? ["rx", "rad", "lab", "rep"].filter(g => c[g].length).map(g => `<section class="card"><h2><span class="ic ${g}">${svg(IC[g])}</span>${t()["g_" + g]}<span class="nb">${c[g].length}</span></h2>
        <ul class="fl">${c[g].map(x => rowOf(g, x)).join("")}</ul></section>`).join("") + (n > 1 ? `<p class="note">${t().allNote}</p>` : "")
        : state("wait", IC.folder, t().emptyT, t().emptyS)}
      <p class="foot">${t().thanks}</p>`;
    const all = $("dlAll"); if (all) all.addEventListener("click", async () => {
      if (busy) return; busy = true; all.disabled = true;
      try { for (const g of ["rx", "rad", "lab", "rep"]) for (const x of c[g]) { await dl(g, x); await new Promise(r => setTimeout(r, 700)); } }
      finally { busy = false; all.disabled = false; }
    });
  }
  async function dl(g, x) {
    if (g === "rx") return MadaReport.downloadRx(x.o, lang, toast);
    if (g === "rad") return MadaRadReport.download(x.r, x.it, lang, toast);
    if (g === "lab") return MadaLabReport.download(x.c, lang, toast);
    return MadaReport.download(x.o, lang, toast);
  }
  $("main").addEventListener("click", async e => {
    const b = e.target.closest("[data-dl]"); if (!b || busy) return;
    const [g, k] = b.dataset.dl.split("|"), p = MadaPatientDocs.find(token), x = p && docs(p)[g].find(y => y.key === k); if (!x) return;
    busy = true; b.disabled = true; try { await dl(g, x); } finally { busy = false; b.disabled = false; }
  });
  $("langBtn").addEventListener("click", () => { lang = lang === "ar" ? "en" : "ar"; render(); });
  // New reports (or a file the team hid) show up without a reload.
  window.addEventListener("storage", e => { if (!busy && (!e.key || ["mada-patients", "mada-orders", "mada-medical"].includes(e.key))) render(); });
  render();
</script>
</body>
</html>
