<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/mada-logo.png">
<title>Mada Care | Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0b6b5c;
    --primary-dark: #08584b;
    --primary-soft: #e6f3ef;
    --ink: #10232b;
    --muted: #6b7a80;
    --border: #e3e8ea;
    --page: #f5f7f8;
    --card: #ffffff;
    --red: #dc2626; --red-soft: #fdecec;
    --orange: #d97706; --orange-soft: #fef3e2;
    --blue: #3b82f6; --blue-soft: #e8f0fe;
    --purple: #7c3aed; --purple-soft: #f1eafe;
    --green: #15803d; --green-soft: #e7f6ec;
    --font: "Inter", "Tajawal", system-ui, sans-serif;
  }
  [dir="rtl"] { --font: "Tajawal", "Inter", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--page); color: var(--ink); min-height: 100vh; }
  button, input, select { font: inherit; color: inherit; }
  svg { flex-shrink: 0; }
  [hidden] { display: none !important; }

  /* ---------- Top bar ---------- */
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 20px; height: 68px; padding: 0 28px; background: #fff; border-bottom: 1px solid var(--border); }
  .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
  .logo img { width: auto; height: 40px; }
  .logo-name { font-size: 17px; font-weight: 600; line-height: 1.1; }
  .logo-tag { font-size: 10.5px; color: var(--primary); }
  .nav { display: flex; gap: 4px; margin-inline-start: 18px; }
  .nav a { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: #44545a; text-decoration: none; }
  .nav a:hover { background: #f1f4f5; }
  .nav a[aria-current="page"] { background: var(--primary-soft); color: var(--primary); }
  .nav-count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 10.5px; font-weight: 600; line-height: 18px; text-align: center; }
  .top-actions { margin-inline-start: auto; display: flex; align-items: center; gap: 10px; }
  .lang-btn { display: flex; align-items: center; gap: 6px; background: none; border: 0; cursor: pointer; font-size: 13px; color: #44545a; padding: 8px; border-radius: 8px; }
  .lang-btn:hover { background: #f1f4f5; }
  .user { position: relative; }
  .user-btn { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 4px 6px; border-radius: 10px; text-align: start; }
  .user-btn:hover { background: #f1f4f5; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
  .user-name { display: block; font-size: 13px; font-weight: 600; }
  .user-role { display: block; font-size: 11px; color: var(--muted); }
  .user-menu { position: absolute; top: 110%; inset-inline-end: 0; min-width: 170px; background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(16,35,43,.08); padding: 6px; display: none; }
  .user.open .user-menu { display: block; }
  .user-menu a { display: block; padding: 9px 10px; border-radius: 6px; font-size: 13px; color: var(--ink); text-decoration: none; }
  .user-menu a:hover { background: var(--primary-soft); color: var(--primary); }

  main { max-width: 1320px; margin: 0 auto; padding: 24px 28px 40px; display: grid; gap: 18px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .page-head h1 { font-size: 24px; font-weight: 600; }
  .page-head p { margin-top: 4px; font-size: 13.5px; color: var(--muted); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; font-size: 13.5px; font-weight: 500; text-decoration: none; white-space: nowrap; }
  .btn svg { width: 17px; height: 17px; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-ghost { background: #fff; color: var(--ink); border-color: #d9e1e3; }
  .btn-ghost:hover { background: #f5f8f8; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: calc(100% - 32px); }
  @media (max-width: 1180px) { .user-meta { display: none; } }
  @media (max-width: 760px) {
    .topbar { padding: 10px 16px; gap: 8px; height: auto; flex-wrap: wrap; }
    .nav { order: 3; flex-basis: 100%; margin-inline-start: 0; }
    .lang-label { display: none; }
    main { padding: 16px 16px 32px; gap: 14px; }
    .page-head h1 { font-size: 21px; }
  }
  .nav { min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { flex: none; }
  .nav a.nav-soon { cursor: default; color: #9aa7ab; }
  .nav a.nav-soon:hover { background: none; }
  .soon-tag { height: 18px; padding: 0 7px; border-radius: 9px; background: var(--orange-soft); color: var(--orange); font-size: 10.5px; font-weight: 600; line-height: 18px; }
  /* ---------- Patients ---------- */
  .ph-title { display: flex; align-items: center; gap: 14px; }
  .ph-icon { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); }
  .ph-icon svg { width: 25px; height: 25px; }
  @media (max-width: 760px) { .ph-icon { width: 40px; height: 40px; } }
  /* ---------- Services ---------- */
  .sv-note { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; background: #f6fbf9; border: 1px solid #cfe7de; font-size: 13.5px; line-height: 1.6; color: #2c3d43; }
  .sv-note svg { width: 19px; height: 19px; color: var(--primary); margin-top: 1px; }
  .sv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .sv { padding: 20px 22px; display: grid; gap: 16px; align-content: start; }
  .sv-h { display: flex; gap: 14px; align-items: flex-start; }
  .sv-ic { width: 50px; height: 50px; border-radius: 13px; display: grid; place-items: center; flex: none; }
  .sv-ic svg { width: 26px; height: 26px; }
  .sv-h h2 { font-size: 18px; font-weight: 600; }
  .sv-h p { margin-top: 3px; font-size: 13px; color: var(--muted); line-height: 1.55; }
  .sv-n { margin-inline-start: auto; font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .c-lab .sv-ic { background: var(--blue-soft); color: var(--blue); }
  .c-rad .sv-ic { background: var(--purple-soft); color: var(--purple); }
  .c-iv .sv-ic { background: var(--orange-soft); color: var(--orange); }
  .c-nurse .sv-ic { background: var(--green-soft); color: var(--green); }
  .c-physio .sv-ic { background: #e0f4f7; color: #0e7490; }
  .sv-cnt { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .sv-box { border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; background: #fbfcfc; }
  .sv-box small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
  .sv-box b { display: block; font-size: 26px; font-weight: 700; line-height: 1.2; color: var(--ink); }
  .sv-box small { margin-top: 2px; font-size: 13px; }
  .sv-box b.none { color: var(--muted); font-weight: 500; font-size: 13.5px; }
  .sv-where { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; background: #f1f4f5; color: #44545a; font-size: 12px; font-weight: 500; }
  .st { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 13px; font-size: 12px; font-weight: 600; }
  .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .st.warn { background: var(--orange-soft); color: var(--orange); }
  .st.go { background: var(--green-soft); color: var(--green); }
  .st.miss { background: var(--red-soft); color: var(--red); }
  .sv-f { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid #eef2f3; }
  .btn[disabled] { opacity: .55; cursor: default; }
  .btn .soon-tag { margin-inline-start: 2px; }
  @media (max-width: 900px) { .sv-grid { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 760px) { .sv { padding: 16px; } .sv-f .btn { width: 100%; } }
</style>
</head>
<body>
<header class="topbar">
  <a class="logo" href="dashboard.html" aria-label="Mada care">
    <img src="assets/mada-logo.png" alt="" width="301" height="320">
    <div>
      <div class="logo-name">Mada Care</div>
      <div class="logo-tag" data-i18n="tagline">Caring Like Family</div>
    </div>
  </a>
  <nav class="nav">
    <a href="dashboard.html" data-i18n="navDashboard">Dashboard</a>
    <a href="requests.html"><span data-i18n="navRequests">Requests</span><span class="nav-count" id="navCount" hidden>0</span></a>
    <a href="bookings.html" data-i18n="navBookings">Bookings</a>
    <a href="patients.html" data-i18n="navPatients">Patients</a>
    <a href="medical-requests.html" data-i18n="navMedical">Medical Requests</a>
    <a href="invoices.html" data-i18n="navInvoices">Invoices</a>
    <a href="services.html" aria-current="page" data-i18n="navServices">Services</a>
    <a href="#" class="nav-soon" aria-disabled="true" onclick="event.preventDefault()"><span data-i18n="navQuality">Quality</span><span class="soon-tag" data-i18n="navSoon">Soon</span></a>
    <a href="staff.html" data-i18n="navStaff">Staff</a>
    <a href="policies.html" data-i18n="navPolicies">Policies</a>
  </nav>
  <div class="top-actions">
    <button class="lang-btn" id="langToggle" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      <span class="lang-label" data-i18n="otherLang">العربية</span>
    </button>
    <div class="user" id="user">
      <button class="user-btn" id="userBtn" type="button" aria-haspopup="menu" aria-expanded="false">
        <span class="avatar" id="avatar">SA</span>
        <span class="user-meta"><span class="user-name" id="userName">Sarah Ahmed</span><span class="user-role" id="userRole">Administrator</span></span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#44545a" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="user-menu" role="menu">
        <a href="#" role="menuitem" data-i18n="profile">My Profile</a>
        <a href="#" role="menuitem" data-i18n="settings">Settings</a>
        <a href="index.html" role="menuitem" id="logout" data-i18n="logout">Log out</a>
      </div>
    </div>
  </div>
</header>
<script src="admin-nav.js"></script>
<main>
  <div class="page-head">
    <div class="ph-title">
      <span class="ph-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><path d="M17 13v8M13 17h8"/></svg></span>
      <div><h1 data-i18n="title">Services</h1><p data-i18n="subtitle">The main service sections. Each section is managed on its own and becomes one list for the dashboard and the Doctor Portal.</p></div>
    </div>
  </div>
  <div class="sv-grid" id="grid"></div>
</main>
<script src="auth.js"></script>
<script src="orders.js"></script>
<script src="labs.js"></script>
<script src="ivtherapy.js"></script>
<script src="nursing.js"></script>
<script src="physio.js"></script>
<script src="radiology.js"></script>
<script>
  const me = MadaAuth.requireAuth("agent");
  const $ = id => document.getElementById(id);
  // Services hub: the five main sections (physio.js: Physiotherapy, dashboard only for now). Counts are read live from today's two separate catalogues:
  // dashboard (labs.js, ivtherapy.js, nursing.js; New Request) and Doctor Portal (doctor-orders.js; Visit > Orders).
  // Next step: a manage page per section that becomes the single list both sides read.
  const SECTIONS = [
    { key: "lab", cls: "c-lab", href: "services-lab.html", ic: '<path d="M9 3h6M10 3v6L5 18a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3L14 9V3"/><path d="M7.5 14h9"/>',
      n: [["tests", MadaLabs.TESTS.length], ["pkgs", MadaLabs.PACKAGES.length]] },
    { key: "rad", cls: "c-rad", href: "services-rad.html", ic: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 7v10M9 9.5h6M9.5 12.5h5M10 15.5h4"/>',
      n: [["exams", MadaRad.EXAMS.length]] },
    { key: "iv", cls: "c-iv", href: "services-iv.html", ic: '<path d="M8 3h8v9a4 4 0 0 1-8 0z"/><path d="M8 8h8M12 16v3M12 19c0 1.5 1.5 2 3 2"/>',
      n: [["pkgs", MadaIV.PACKAGES.length]] },
    { key: "nurse", cls: "c-nurse", href: "services-nurse.html", ic: '<circle cx="12" cy="7" r="3.5"/><path d="M5 21c.8-4 3.5-6.5 7-6.5s6.2 2.5 7 6.5"/><path d="M12 15.5v3M10.5 17h3"/>',
      n: [["svcs", MadaNursing.SERVICES.length]] },
    { key: "physio", cls: "c-physio", href: "services-physio.html", ic: '<circle cx="12" cy="4.5" r="2"/><path d="M12 7v6l-3 8M12 13l3 8M7 10l5-1 5 1"/>',
      n: [["svcs", MadaPhysio.SERVICES.length], ["pkgs", MadaPhysio.PACKAGES.length]] }
  ];
  const i18n = {
    en: {
      tagline: "Caring Like Family", otherLang: "العربية", profile: "My Profile", settings: "Settings", logout: "Log out",
      navDashboard: "Dashboard", navRequests: "Requests", navBookings: "Bookings", navPatients: "Patients", navMedical: "Medical Requests", navInvoices: "Invoices", navQuality: "Quality", navSoon: "Soon", navStaff: "Staff", navPolicies: "Policies", navServices: "Services",
      title: "Services", subtitle: "The main service sections. Each section is managed on its own and becomes one list for the dashboard and the Doctor Portal.",
      note: "Today the dashboard and the Doctor Portal each keep their own list. We will unify one section at a time, so every service is added once here and shows in both.",
      lab: "Laboratory", labD: "Lab tests and test packages.", rad: "Radiology", radD: "X-ray, ultrasound and other imaging.", iv: "IV Therapy", ivD: "IV drips and IV packages.", nurse: "Nursing Services", nurseD: "Home nursing care and procedures.", physio: "Physiotherapy", physioD: "Home physiotherapy sessions and rehab programs.", l_prog: "Programs",
      sec: "Section {n}", inDash: "Dashboard", inDoc: "Doctor Portal", tests: "{n} tests", pkgs: "{n} packages", svcs: "{n} services", drips: "{n} drips", exams: "{n} exams", none: "Not added yet",
      stSplit: "2 separate lists, to unify", stDocOnly: "Doctor Portal only", l_tests: "Tests", l_pkgs: "Packages", l_exams: "Exams", l_svcs: "Services", stLab: "Managed here · Doctor Portal next", shows: "Shows in:",
      wNew: "New Request", wDocOrders: "Doctor visit > Orders", wLabPage: "Lab test page", wDocOrdersList: "Doctor Orders (reports)",
      manage: "Manage", soon: "Next step"
    },
    ar: {
      tagline: "رعاية كالعائلة", otherLang: "English", profile: "ملفي الشخصي", settings: "الإعدادات", logout: "تسجيل الخروج",
      navDashboard: "الرئيسية", navRequests: "الطلبات", navBookings: "الحجوزات", navPatients: "المرضى", navMedical: "الطلبات الطبية", navInvoices: "الفواتير", navQuality: "الجودة", navSoon: "قريباً", navStaff: "الموظفين", navPolicies: "السياسات", navServices: "الخدمات",
      title: "الخدمات", subtitle: "الأقسام الرئيسية للخدمات. كل قسم يتدار لحاله ويصير قائمة وحدة للوحة التحكم وبوابة الطبيب.",
      note: "الحين لوحة التحكم وبوابة الطبيب كل وحدة لها قائمتها. بنوحّد قسم قسم، عشان كل خدمة تنضاف مرة وحدة هنا وتظهر في الاثنين.",
      lab: "التحاليل", labD: "التحاليل المخبرية وباقات التحاليل.", rad: "الأشعة", radD: "الأشعة السينية والسونار وباقي الفحوصات التصويرية.", iv: "محاليل الوريد", ivD: "المحاليل الوريدية وباقاتها.", nurse: "خدمات التمريض", nurseD: "الرعاية التمريضية والإجراءات في المنزل.",
      sec: "القسم {n}", inDash: "لوحة التحكم", inDoc: "بوابة الطبيب", tests: "{n} تحليل", pkgs: "{n} باقة", svcs: "{n} خدمة", drips: "{n} محلول", exams: "{n} فحص", none: "ما انضاف للحين",
      stSplit: "قائمتين منفصلة، تحتاج توحيد", stDocOnly: "في بوابة الطبيب فقط", l_tests: "تحليل", l_pkgs: "باقة", l_exams: "فحص", l_svcs: "خدمة", l_prog: "برنامج", physio: "العلاج الطبيعي", physioD: "جلسات العلاج الطبيعي في البيت وبرامج التأهيل.", stLab: "تتدار من هنا · بوابة الطبيب الجاية", shows: "يظهر في:",
      wNew: "طلب جديد", wDocOrders: "زيارة الطبيب > الطلبات", wLabPage: "صفحة التحليل", wDocOrdersList: "طلبات الطبيب (التقارير)",
      manage: "إدارة", soon: "الخطوة الجاية"
    }
  };
  let current = "en";
  const t = () => i18n[current];
  const tx = (k, v) => t()[k].replace(/\{(\w+)\}/g, (_, x) => v[x]);
  const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const ITEM = { lab: "tests", rad: "exams", iv: "drips", nurse: "svcs" };
  function count(s, c) {
    if (!c) return `<b class="none">${t().none}</b>`;
    const p = []; if (c.items != null) p.push(tx(ITEM[s.key], { n: c.items })); if (c.pkgs != null) p.push(tx("pkgs", { n: c.pkgs }));
    return `<b>${p.join(" · ")}</b>`;
  }
  function render() {
    $("grid").innerHTML = SECTIONS.map((s, i) => `<section class="card sv ${s.cls}" aria-labelledby="h-${s.key}">
      <div class="sv-h"><span class="sv-ic">${svg(s.ic)}</span><div><h2 id="h-${s.key}">${t()[s.key]}</h2><p>${t()[s.key + "D"]}</p></div><span class="sv-n">${tx("sec", { n: i + 1 })}</span></div>
      <div class="sv-cnt">${s.n.map(([k, v]) => `<div class="sv-box"><b>${v}</b><small>${t()["l_" + k]}</small></div>`).join("")}</div>
      <div class="sv-f">
        ${s.href ? `<a class="btn btn-primary" href="${s.href}">${t().manage}</a>` : `<button type="button" class="btn btn-ghost" disabled>${t().manage}<span class="soon-tag">${t().soon}</span></button>`}</div>
    </section>`).join("");
  }
  function setLang(lang) {
    current = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t()[el.dataset.i18n]);
    if (me) { $("userName").textContent = me.name[lang]; $("userRole").textContent = me.role[lang]; $("avatar").textContent = me.initials[lang]; }
    document.title = lang === "ar" ? "مدى كير | الخدمات" : "Mada Care | Services";
    try { localStorage.setItem("mada-lang", lang); } catch (e) {}
    render();
  }
  $("langToggle").addEventListener("click", () => setLang(current === "en" ? "ar" : "en"));
  const user = $("user"), userBtn = $("userBtn");
  userBtn.addEventListener("click", e => { e.stopPropagation(); userBtn.setAttribute("aria-expanded", user.classList.toggle("open")); });
  document.addEventListener("click", () => { user.classList.remove("open"); userBtn.setAttribute("aria-expanded", false); });
  $("logout").addEventListener("click", e => { e.preventDefault(); MadaAuth.logout(); });
  { const n = MadaOrders.needsAction(), c = $("navCount"); c.hidden = !n; c.textContent = n; }

  let saved = "en";
  try { saved = localStorage.getItem("mada-lang") || "en"; } catch (e) {}
  setLang(saved);
</script>
</body>
</html>
